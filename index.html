<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPECTRA Navigator</title>
<meta name="description" content="Offline navigator for the SPECTRA space cyber framework: attack-path matrix, threat surface, actors, incidents, controls and assessment.">
<style>
:root{
  --bg:#eef1f8; --surface:#ffffff; --raised:#f5f7fc; --line:#d3daea; --text:#1b2240; --muted:#5a668a;
  --accent:#2d4fb3; --accent-ink:#ffffff; --shadow:0 10px 30px rgba(27,34,64,.16);
  --bad:#cf3f55; --warn:#c98a12; --good:#2b9a62; --na:#8c95b0;
  --MSN:#8f6cf2; --EXP:#5c7cf5; --POS:#2f9fe6; --CTL:#19b3b3; --SRV:#3bb273; --TRN:#b3b12e; --MNP:#e8a22c; --EFX:#e5553f; --RSL:#7f8bb0;
  --font:"Avenir Next","Segoe UI Variable Text","Segoe UI","Helvetica Neue",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --r:6px; --top:104px;
}
:root[data-theme="dark"]{
  --bg:#141a31; --surface:#1c2441; --raised:#252f54; --line:#34406b; --text:#e9ecf7; --muted:#9ba6c9;
  --accent:#a9c8ff; --accent-ink:#141a31; --shadow:0 14px 40px rgba(4,8,24,.55);
  --bad:#f0667b; --warn:#f0b849; --good:#55c98a; --na:#7b86ab; --RSL:#cfd6ea;
}
*{box-sizing:border-box}
html{font-family:var(--font);font-size:15px;line-height:1.45;color:var(--text);background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{margin:0;font-weight:650;line-height:1.2}
p{margin:0 0 .7em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
[data-ph="MSN"]{--ph:var(--MSN)}[data-ph="EXP"]{--ph:var(--EXP)}[data-ph="POS"]{--ph:var(--POS)}[data-ph="CTL"]{--ph:var(--CTL)}[data-ph="SRV"]{--ph:var(--SRV)}[data-ph="TRN"]{--ph:var(--TRN)}[data-ph="MNP"]{--ph:var(--MNP)}[data-ph="EFX"]{--ph:var(--EFX)}[data-ph="RSL"]{--ph:var(--RSL)}

/* header */
.top{position:sticky;top:0;z-index:45;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;padding:10px 18px}
.brand{display:flex;align-items:baseline;gap:10px;text-decoration:none;color:var(--text);white-space:nowrap}
.brand b{font-size:1.25rem;font-weight:750;letter-spacing:.22em}
.brand span{color:var(--muted);font-size:.82rem}
.search{flex:1;max-width:460px;margin-left:auto;position:relative}
.search input{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--raised)}
.iconbtn{border:1px solid var(--line);background:var(--raised);border-radius:var(--r);padding:7px 11px;white-space:nowrap}
.iconbtn:hover{border-color:var(--accent)}
.rainbow{height:4px;display:flex}
.rainbow i{flex:1;background:var(--ph)}
.tabs{display:flex;gap:2px;padding:0 12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 12px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;font-weight:550}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}

/* layout */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);align-items:start}
.shell.nofilters{grid-template-columns:minmax(0,1fr)}
.filters{position:sticky;top:var(--top);height:calc(100vh - var(--top));overflow:auto;border-right:1px solid var(--line);background:var(--surface);padding:12px 14px 40px}
.shell.nofilters .filters{display:none}
main{padding:16px 18px 80px;min-width:0}
.filters h2{font-size:.95rem;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.linkbtn{border:0;background:none;color:var(--accent);padding:2px 0;text-decoration:underline;text-underline-offset:2px}
.facet{border-top:1px solid var(--line);padding:4px 0}
.facet summary{list-style:none;cursor:pointer;padding:6px 0;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.facet summary::-webkit-details-marker{display:none}
.facet summary em{font-style:normal;color:var(--accent-ink);background:var(--accent);border-radius:10px;padding:0 7px;font-size:.78rem}
.facet .grp{color:var(--muted);font-size:.8rem;margin:8px 0 2px}
.opt{display:flex;align-items:flex-start;gap:7px;padding:3px 0;font-size:.9rem;cursor:pointer}
.opt input{margin-top:3px;accent-color:var(--accent)}
.opt span{flex:1}
.opt i{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums;font-size:.82rem}
.opt.zero{opacity:.45}

/* common bits */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:12px}
.toolbar .grow{flex:1}
.count{font-weight:600}
.count small{color:var(--muted);font-weight:400}
select,.field{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px 9px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px 12px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:2px 4px 2px 10px;font-size:.84rem}
.chip button{border:0;background:var(--raised);border-radius:50%;width:20px;height:20px;line-height:1;padding:0}
.tag{display:inline-block;border:1px solid var(--line);border-radius:4px;padding:0 6px;font-size:.78rem;color:var(--muted);white-space:nowrap}
.tag.ph{border-color:var(--ph);color:var(--text);background:color-mix(in srgb,var(--ph) 16%,var(--surface))}
.tag.O,.tag.R,.tag.gov{border-color:var(--bad);color:var(--text)}
.tag.D,.tag.A,.tag.vendor{border-color:var(--warn);color:var(--text)}
.tag.T,.tag.research{border-color:var(--EXP);color:var(--text)}
.tag.C,.tag.claimed{border-style:dashed;color:var(--text)}
.id{font-variant-numeric:tabular-nums;font-weight:650;font-size:.8rem;color:var(--muted);letter-spacing:.02em}
.lede{max-width:70ch;color:var(--muted);margin-bottom:14px}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.82rem;color:var(--muted);margin-bottom:10px;align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line)}

/* matrix */
.matrix{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(120px,1fr);gap:6px;overflow-x:auto;padding-bottom:10px;align-items:start}
.col{min-width:0}
.colhead{display:block;width:100%;text-align:left;border:0;border-top:5px solid var(--ph);border-radius:var(--r) var(--r) 0 0;background:color-mix(in srgb,var(--ph) 20%,var(--surface));padding:8px 9px 9px;position:sticky;top:0}
.colhead b{display:block;font-size:.98rem}
.colhead span{display:block;font-size:.78rem;color:var(--muted);min-height:2.7em;line-height:1.3;margin-top:2px}
.colhead em{font-style:normal;font-size:.78rem;font-variant-numeric:tabular-nums}
.cells{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.cell{display:block;width:100%;text-align:left;border:1px solid var(--line);border-left:3px solid var(--ph);border-radius:4px;padding:6px 8px 7px;
  background:color-mix(in srgb,var(--heat,transparent) var(--amt,0%),var(--surface));position:relative}
.cell:hover{border-color:var(--accent);border-left-color:var(--ph)}
.cell.sel{outline:2px solid var(--accent);outline-offset:1px}
.cell.dim{opacity:.22}
.cell .nm{display:block;font-size:.86rem;line-height:1.25;margin-top:1px}
.cell .meta{display:flex;gap:6px;align-items:center;margin-top:5px}
.bars{display:inline-flex;gap:2px;align-items:flex-end;height:10px}
.bars i{width:3px;background:var(--line);border-radius:1px}
.bars i:nth-child(1){height:4px}.bars i:nth-child(2){height:6px}.bars i:nth-child(3){height:8px}.bars i:nth-child(4){height:10px}
.bars i.on{background:var(--text)}
.dot{flex:none;width:9px;height:9px;border-radius:50%;margin-left:auto;border:1px solid var(--line)}
.dot.exposed{background:var(--bad);border-color:var(--bad)}.dot.partial{background:var(--warn);border-color:var(--warn)}.dot.verified{background:var(--good);border-color:var(--good)}.dot.na{background:var(--na);border-color:var(--na)}

/* lists */
.rows{display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;align-items:center;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 12px}
button.row:hover{border-color:var(--accent)}
.row h3{font-size:1rem}
.row p{margin:3px 0 0;color:var(--muted);font-size:.88rem}
.row .side{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;align-items:center}
.year{font-size:1.5rem;font-weight:700;margin:22px 0 8px;font-variant-numeric:tabular-nums}
.year:first-child{margin-top:0}
.group{margin:22px 0 8px;display:flex;align-items:baseline;gap:10px}
.group:first-of-type{margin-top:4px}
.group small{color:var(--muted)}
.seg3{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg3 button{border:0;background:var(--surface);padding:5px 9px;font-size:.82rem;border-left:1px solid var(--line)}
.seg3 button:first-child{border-left:0}
.seg3 button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.meter{height:6px;background:var(--raised);border-radius:3px;overflow:hidden;min-width:70px}
.meter i{display:block;height:100%;background:var(--accent)}

/* surface */
.surface{display:grid;gap:10px;grid-template-columns:1fr 1.2fr 1.2fr;grid-template-areas:"supply space space" "supply link link" "supply ground user"}
.segbox{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px}
.segbox header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}
.segbox header button{border:0;background:none;padding:0;font-weight:650;font-size:1.05rem;text-align:left;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
.segbox header button:hover{text-decoration-color:var(--accent)}
.segbox>p{color:var(--muted);font-size:.86rem;margin-bottom:8px}
.assets{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px}
.asset{position:relative;overflow:hidden;text-align:left;border:1px solid var(--line);background:var(--raised);border-radius:4px;padding:7px 9px;display:flex;justify-content:space-between;gap:8px;font-size:.88rem}
.asset:hover{border-color:var(--accent)}
.asset::before{content:"";position:absolute;inset:0 auto 0 0;width:var(--w);background:color-mix(in srgb,var(--accent) 16%,transparent)}
.asset span,.asset b{position:relative}
.asset b{font-variant-numeric:tabular-nums}
.a-space{grid-area:space}.a-link{grid-area:link}.a-ground{grid-area:ground}.a-user{grid-area:user}.a-supply{grid-area:supply}
.a-supply .assets{grid-template-columns:1fr}

/* paths */
.path{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-bottom:8px}
.path summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px}
.path summary::-webkit-details-marker{display:none}
.path summary h3{font-size:1.02rem}
.path summary p{grid-column:1/-1;color:var(--muted);margin:0;font-size:.9rem;max-width:80ch}
.strip{display:flex;gap:2px;align-items:center}
.strip i{width:14px;height:8px;border-radius:2px;background:var(--ph)}
.pathbody{padding:2px 14px 14px}
.steps{list-style:none;margin:8px 0 14px;padding:0}
.steps li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:0 10px;position:relative;padding-bottom:10px}
.steps li::before{content:"";grid-row:1/3;width:12px;height:12px;border-radius:50%;background:var(--ph);margin:5px 0 0 5px;z-index:1}
.steps li::after{content:"";position:absolute;left:10px;top:12px;bottom:-6px;width:2px;background:var(--line)}
.steps li:last-child::after{display:none}
.steps button{border:0;background:none;padding:0;text-align:left;font-weight:600;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.steps button:hover{text-decoration-color:var(--accent)}
.steps small{grid-column:2;color:var(--muted);font-size:.88rem}
.inline{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
.pill{border:1px solid var(--line);background:var(--raised);border-radius:4px;padding:3px 8px;font-size:.84rem;text-align:left}
button.pill:hover{border-color:var(--accent)}

/* assess */
.phasebars{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin-bottom:16px}
.pb{border:1px solid var(--line);border-top:4px solid var(--ph);border-radius:var(--r);background:var(--surface);padding:8px 10px}
.pb b{display:block;font-size:.9rem}
.pb small{color:var(--muted)}
.stack{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--raised);margin:6px 0 4px}
.stack i{display:block}
.s-exposed{background:var(--bad)}.s-partial{background:var(--warn)}.s-verified{background:var(--good)}.s-na{background:var(--na)}
table{border-collapse:collapse;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top;font-size:.9rem}
th{font-size:.82rem;color:var(--muted);font-weight:600;background:var(--raised)}
td select{padding:3px 6px;font-size:.86rem}
td button.linkbtn{text-align:left;color:var(--text)}
.tablewrap{overflow-x:auto}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,14,34,.35);z-index:40;display:none}
.scrim.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:50;transform:translateX(102%);transition:transform .18s ease;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer header{padding:14px 18px 12px;border-bottom:1px solid var(--line);border-top:5px solid var(--ph,var(--accent));display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.drawer header h2{font-size:1.25rem;margin-top:4px}
.drawer header .iconbtn{align-self:start}
.drawer .body{overflow:auto;padding:14px 18px 60px}
.drawer h4{font-size:.86rem;color:var(--muted);font-weight:600;margin:16px 0 5px}
.drawer h4:first-child{margin-top:0}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:.9rem}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.box{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--raised)}
.box p:last-child{margin:0}
textarea{width:100%;min-height:74px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:8px;resize:vertical}
.list{display:flex;flex-direction:column;gap:4px}
.list button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:6px 9px;display:flex;gap:8px;align-items:baseline}
.list button:hover{border-color:var(--accent)}
.list button>span{flex:1}
.list button>.id,.list button>.tag{flex:none}
.prose{max-width:74ch}
.prose h2{font-size:1.25rem;margin:26px 0 8px}
.prose h2:first-child{margin-top:0}
.prose ol,.prose ul{padding-left:1.3em;margin:0 0 .8em}
.prose li{margin-bottom:.25em}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:var(--r);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.only-m{display:none}

@media (max-width:900px){
  :root{--top:0px}
  .top{position:static}
  .bar{flex-wrap:wrap;padding:10px 12px;gap:8px}
  .brand span{display:none}
  .search{order:3;flex-basis:100%;max-width:none;margin:0}
  .bar .spacer{flex:1}
  .only-m{display:inline-block}
  .shell{grid-template-columns:minmax(0,1fr)}
  .filters{position:fixed;inset:0 18% 0 0;height:auto;z-index:50;transform:translateX(-102%);transition:transform .18s ease;box-shadow:var(--shadow)}
  .filters.on{transform:none}
  main{padding:12px 12px 80px}
  .matrix{display:block;overflow:visible}
  .col{margin-bottom:6px}
  .colhead{position:static;border-radius:var(--r);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 10px;align-items:center}
  .colhead span{min-height:0;grid-column:1}
  .colhead em{grid-column:2;grid-row:1/3}
  .col.shut .cells{display:none}
  .cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .surface{grid-template-columns:1fr;grid-template-areas:"space" "link" "ground" "user" "supply"}
  .a-supply .assets{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
  .row{grid-template-columns:minmax(0,1fr)}
  .row .side{justify-content:flex-start}
  .drawer{width:100vw}
}
@media (prefers-reduced-motion:reduce){.drawer,.filters,.toast{transition:none}}
@media print{
  .top,.filters,.drawer,.scrim,.toolbar .btn,.toast{display:none!important}
  .shell{display:block}
  html{font-size:11px;background:#fff}
  .matrix{display:block}.cells{display:grid;grid-template-columns:repeat(4,1fr)}
}
</style>
</head>
<body>
<div class="top">
  <div class="bar">
    <a class="brand" href="#view=matrix" data-act="home"><b>SPECTRA</b><span id="ver"></span></a>
    <span class="spacer"></span>
    <button class="iconbtn only-m" data-act="filters" id="fbtn">Filters</button>
    <label class="search"><span class="sr">Search</span><input id="q" type="search" placeholder="Search techniques, actors, incidents, controls" autocomplete="off"></label>
    <button class="iconbtn" data-act="theme" id="themebtn" aria-label="Switch colour theme">Dark</button>
  </div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Views"></nav>
  <div class="rainbow" id="rainbow" aria-hidden="true"></div>
</div>
<div class="shell" id="shell">
  <aside class="filters" id="filters" aria-label="Filters"></aside>
  <main id="main" tabindex="-1"></main>
</div>
<div class="scrim" id="scrim" data-act="close"></div>
<aside class="drawer" id="drawer" aria-label="Details"></aside>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="file" accept="application/json,.json" hidden>

<script>
"use strict";
const DATA = {"meta":{"name":"SPECTRA","long_name":"Space Protection, Exploitation, Continuity, Threat Response & Assurance","version":"0.2.0","released":"2026-11-12","license":"Apache-2.0","notice":"SPECTRA content is original, paraphrased educational material for defensive assessment. Techniques are described at the level of behaviour, never as procedures. Actor and incident records summarise public reporting and carry an attribution label; claims by actors themselves are marked as claimed and are not verified by SPECTRA."},"taxonomy":{"segments":[{"id":"space","name":"Space segment","desc":"Spacecraft bus, payload, on-board software and crosslinks."},{"id":"link","name":"Link segment","desc":"Telecommand, telemetry, payload and navigation signals in transit."},{"id":"ground","name":"Ground segment","desc":"Stations, mission control, flight dynamics, data processing, cloud and enterprise IT."},{"id":"user","name":"User segment","desc":"User terminals, receivers, hubs and the services built on them."},{"id":"supply","name":"Supply chain and build","desc":"Vendors, development toolchains, integration and test, launch interfaces, people."}],"assets":[{"id":"obc","seg":"space","name":"On-board computer and data handling"},{"id":"fsw","seg":"space","name":"Flight software and bootloader"},{"id":"bus","seg":"space","name":"On-board data bus"},{"id":"aocs","seg":"space","name":"Attitude and orbit control"},{"id":"eps","seg":"space","name":"Power and thermal"},{"id":"payload","seg":"space","name":"Mission payload"},{"id":"crypto","seg":"space","name":"On-board crypto unit and keys"},{"id":"hosted","seg":"space","name":"Hosted payload and third-party apps"},{"id":"isl","seg":"space","name":"Inter-satellite link terminal"},{"id":"tc","seg":"link","name":"Telecommand uplink"},{"id":"tm","seg":"link","name":"Telemetry downlink"},{"id":"pdl","seg":"link","name":"Payload and feeder link"},{"id":"gnss","seg":"link","name":"Navigation signal"},{"id":"gs","seg":"ground","name":"Gr ate-linked","name":"State-linked persona"},{"id":"hacktivist","name":"Hacktivist"},{"id":"criminal","name":"Criminal"},{"id":"insider","name":"Insider"},{"id":"other","name":"Other"}],"incident_kinds":[{"id":"attack","name":"Disruptive attack"},{"id":"espionage","name":"Espionage"},{"id":"intrusion","name":"Intrusion"},{"id":"interference","name":"Radio interference"},{"id":"extortion","name":"Extortion"},{"id":"claim","name":"Unverified claim"},{"id":"research","name":"Research or exercise"}],"map_basis":[{"id":"R","name":"Reported","desc":"Behaviour described in public reporting on this actor."},{"id":"C","name":"Claimed","desc":"Behaviour the actor claims; not independently confirmed."},{"id":"A","name":"Assessed","desc":"Typical of this actor class; SPECTRA's own assessment."}]},"phases":[{"id":"MSN","n":1,"name":"Mission","verb":"Understand the mission","desc":"The adversary learns what the mission is for, who depends on it and how it is built and operated.","defender":"Know what you expose about the mission and which dependencies an outsider can map.","sparta":["Reconnaissance"],"attack":["Reconnaissance"]},{"id":"EXP","n":2,"name":"Exposure","verb":"Find and prepare the opening","desc":"The adversary turns knowledge into capability: equipment, replicas, vulnerabilities, access and people.","defender":"Reduce what can be researched offline and make weaknesses expensive to find.","sparta":["Resource Development"],"attack":["Resource Development"]},{"id":"POS","n":3,"name":"Positioning","verb":"Gain a foothold","desc":"The adversary obtains a first position in any segment from which the mission can be reached.","defender":"Treat every segment boundary as an entry point, including vendors, terminals and the spectrum.","sparta":["Initial Access"],"attack":["Initial Access"]},{"id":"CTL","n":4,"name":"Control","verb":"Take authority","desc":"The adversary converts a foothold into the ability to execute: commands, code or privileged actions.","defender":"Make command authority depend on cryptography and independent approval, not on network position.","sparta":["Execution"],"attack":["Execution","Privilege Escalation","Credential Access"]},{"id":"SRV","n":5,"name":"Survival","verb":"Stay and stay hidden","desc":"The adversary keeps access across resets, updates and investigations while avoiding notice.","defender":"Assume telemetry and logs can lie; keep an independent way to establish the truth.","sparta":["Persistence","Defense Evasion"],"attack":["Persistence","Defense Evasion"]},{"id":"TRN","n":6,"name":"Transit","verb":"Cross segment boundaries","desc":"The adversary moves between segments, spacecraft, tenants and organisations along trusted paths.","defender":"Every trusted path is a route. Constrain what each path can carry and verify at both ends.","sparta":["Lateral Movement"],"attack":["Lateral Movement","Discovery"]},{"id":"MNP","n":7,"name":"Manipulation","verb":"Take or alter","desc":"The adversary collects, removes or changes data, parameters and signals without yet breaking the mission.","defender":"Protect the integrity and provenance of what the mission produces and consumes.","sparta":["Exfiltration"],"attack":["Collection","Exfiltration","Command and Control"]},{"id":"EFX","n":8,"name":"Mission Effect","verb":"Break the mission","desc":"The adversary denies, degrades, deceives or destroys the service the mission exists to deliver.","defender":"Measure impact in mission terms and design so that a single effect does not end the mission.","sparta":["Impact"],"attack":["Impact"]},{"id":"RSL","n":9,"name":"Resilience","verb":"Contest the recovery","desc":"The adversary attacks detection, response and recovery so the operator cannot return to a trusted state.","defender":"Prove recovery works while under attack: rehearse it, time it and verify the result is trustworthy.","sparta":["Impact","Persistence"],"attack":["Impact","Inhibit Response (ICS)"]}],"techniques":[{"id":"MSN-01","phase":"MSN","name":"Mission and operator profiling","description":"Collect public material on what the mission does, who pays for it and who depends on it, to judge which effect would matter most.","segments":["ground","supply"],"assets":["people","it"],"vectors":["social","net"],"missions":[],"tier":1,"basis":"O","precondition":"Mission information is public through press, procurement, customer or academic channels.","effects":["ME-02"],"controls":["SC-05","SC-29"],"data_sources":["DS-15"],"detection":"Rarely visible; exposure reviews and unusual interest in staff or documents are the practical signals.","assessment":{"question":"Could an outsider name our most valuable service and its most dependent customer from public sources alone?","environments":["osint","tab"],"evidence":"A target pack assembled by an independent reviewer within a fixed time box.","recovery_test":"Confirm the mission can state which public disclosures were accepted and which were withdrawn."}},{"id":"MSN-02","phase":"MSN","name":"Regulatory filing harvest","description":"Read spectrum, licensing and coordination filings to learn frequencies, emission types, orbits and station locations.","segments":["link","ground"],"assets":["tc","tm","pdl","gs"],"vectors":["net"],"missions":[],"tier":1,"basis":"O","precondition":"The mission has filed with national or international spectrum and licensing bodies.","effects":["ME-02"],"controls":["SC-05"],"data_sources":["DS-15"],"detection":"Not detectable; treat filed parameters as known to every adversary.","assessment":{"question":"Which link and station parameters can be recovered from our filings, and does any protection rely on them being secret?","environments":["osint"],"evidence":"A table of parameters recovered from filings against those in the interface documents.","recovery_test":"Not applicable; verify no control assumes these values are confidential."}},{"id":"MSN-03","phase":"MSN","name":"Orbit and pass prediction","description":"Use published orbital elements to predict when the spacecraft is in view of a given location and when operators are in contact.","segments":["space","link"],"assets":["tc","tm"],"vectors":["net"],"missions":[],"tier":1,"basis":"O","precondition":"Orbital elements are published or can be derived from observation.","effects":["ME-02"],"controls":["SC-04","SC-05"],"data_sources":["DS-15","DS-13"],"detection":"Not detectable; correlate later radio events with predicted adversary visibility.","assessment":{"question":"At which points in the orbit is the spacecraft in view of uncontrolled territory but out of our own contact?","environments":["osint","twin"],"evidence":"A visibility timeline marking operator contact, out-of-contact periods and third-party visibility.","recovery_test":"Confirm out-of-contact autonomy is safe if commands arrive only from an untrusted source."}},{"id":"MSN-04","phase":"MSN","name":"Spacecraft design intelligence gathering","description":"Assemble design knowledge from papers, theses, vendor datasheets, manuals, conference talks and open-source flight software.","segments":["space","supply"],"assets":["obc","fsw","bus","cots"],"vectors":["net","social"],"missions":[],"tier":1,"basis":"O","precondition":"Design details have been published by the operator, its suppliers or academic partners.","effects":["ME-02"],"controls":["SC-05","SC-02","SC-17"],"data_sources":["DS-15"],"detection":"Download and access patterns on documentation portals; otherwise not detectable.","assessment":{"question":"How complete a picture of the on-board architecture and command set can be built without any insider help?","environments":["osint"],"evidence":"An architecture sketch produced by a reviewer from public material, with sources.","recovery_test":"Not applicable; feed findings into the exposure register."}},{"id":"MSN-05","phase":"MSN","name":"Ground station and teleport mapping","description":"Locate antennas, teleports and service providers from imagery, filings, provider marketing and network data.","segments":["ground"],"assets":["gs","net","cloud"],"vectors":["net","phys"],"missions":[],"tier":1,"basis":"O","precondition":"Stations are fixed, visible and often shared with other operators.","effects":["ME-02"],"controls":["SC-05","SC-04","SC-03"],"data_sources":["DS-15","DS-14"],"detection":"Physical surveillance indicators at sites; scanning of station address space.","assessment":{"question":"Which stations and providers carry our commands, and which of them could an outsider identify?","environments":["osint"],"evidence":"A list of sites and providers identified externally versus the real contact plan.","recovery_test":"Confirm an alternate site exists that does not appear in the same public sources."}},{"id":"MSN-06","phase":"MSN","name":"Passive downlink signal survey","description":"Receive and record the spacecraft's emissions to learn modulation, framing, beacons and operating habits.","segments":["link"],"assets":["tm","pdl"],"vectors":["rf"],"missions":[],"tier":2,"basis":"O","precondition":"A receiver within the downlink footprint; nothing more.","effects":["ME-02"],"controls":["SC-08","SC-05"],"data_sources":["DS-05"],"detection":"Passive reception cannot be detected.","assessment":{"question":"What can be learned about spacecraft state and operations from an unkeyed receiver in the footprint?","environments":["rf","osint"],"evidence":"Decoded frame structure and any readable fields from a lab capture of the mission's own downlink.","recovery_test":"Confirm encrypted downlinks reveal no state through unprotected headers or beacons."}},{"id":"MSN-07","phase":"MSN","name":"Command and telemetry format reconstruction","description":"Rebuild the meaning of telemetry and command structures from captures, public decoders, leaked databases or shared standards.","segments":["link","space"],"assets":["tc","tm","fsw"],"vectors":["rf","net"],"missions":[],"tier":2,"basis":"D","precondition":"Captured traffic, a published standard or a leaked or open command database.","effects":["ME-02"],"controls":["SC-08","SC-07","SC-05"],"data_sources":["DS-15"],"detection":"Leak monitoring for mission databases; otherwise not detectable.","assessment":{"question":"If the command database leaked tomorrow, what would still stop a third party issuing a valid command?","environments":["rf","hil"],"evidence":"A statement of which protections remain when formats are assumed known.","recovery_test":"Confirm no safety case depends on format obscurity."}},{"id":"MSN-08","phase":"MSN","name":"Workforce and contractor research","description":"Identify operators, engineers and suppliers, and infer tools and technologies from profiles, adverts and talks.","segments":["supply","ground"],"assets":["people","it"],"vectors":["social","net"],"missions":[],"tier":1,"basis":"O","precondition":"Staff and suppliers describe their work publicly.","effects":["ME-02"],"controls":["SC-05","SC-23"],"data_sources":["DS-15"],"detection":"Reports from staff of unusual contact; spikes in profile views are weak signals.","assessment":{"question":"Which roles with command or release authority can be identified and contacted from public sources?","environments":["osint","tab"],"evidence":"A list of exposed privileged roles and the technologies their adverts reveal.","recovery_test":"Confirm exposed roles have stronger sign-in and are covered by targeted awareness."}},{"id":"MSN-09","phase":"MSN","name":"Supply chain and component mapping","description":"Work out which suppliers, components, frameworks and service providers the mission relies on, looking for the weakest.","segments":["supply"],"assets":["cots","dev"],"vectors":["net","social"],"missions":[],"tier":2,"basis":"O","precondition":"Supplier relationships are visible through contracts, press, hardware teardown or software artefacts.","effects":["ME-02"],"controls":["SC-02","SC-05"],"data_sources":["DS-15","DS-10"],"detection":"Supplier-side reports of targeting; otherwise not detectable.","assessment":{"question":"Which single supplier, if compromised, reaches the most missions or the most privileged function?","environments":["osint"],"evidence":"A dependency map ranking suppliers by reach into flight and operations.","recovery_test":"Confirm an alternative exists, or a compensating check, for the highest-ranked supplier."}},{"id":"MSN-10","phase":"MSN","name":"Exposed infrastructure discovery","description":"Scan and search for internet-reachable modems, antenna controllers, remote-access appliances, portals and service endpoints.","segments":["ground","user"],"assets":["gs","net","ut","nms","cloud"],"vectors":["net"],"missions":[],"tier":1,"basis":"O","precondition":"Mission or station equipment is reachable from the internet, deliberately or by mistake.","effects":["ME-02"],"controls":["SC-16","SC-05","SC-06"],"data_sources":["DS-06","DS-15"],"detection":"Scan traffic at the perimeter; exposure-monitoring services reporting your own assets.","assessment":{"question":"What mission-related management interfaces can be reached from the internet today?","environments":["osint","auth"],"evidence":"An inventory of externally reachable services with owner and justification.","recovery_test":"Confirm each exposed service can be withdrawn quickly without stopping operations."}},{"id":"MSN-11","phase":"MSN","name":"Clear-text traffic survey","description":"Listen to unencrypted user or backhaul traffic on broad satellite beams to learn about the networks and people using them.","segments":["link","user"],"assets":["pdl","ut"],"vectors":["rf"],"missions":[],"tier":2,"basis":"D","precondition":"Traffic on the link is not encrypted and the beam covers the listener.","effects":["ME-02"],"controls":["SC-08"],"data_sources":["DS-05"],"detection":"Not detectable on the link; only an audit of what is sent in clear reveals the exposure.","assessment":{"question":"What internal addressing, credentials or operational content crosses our space links unencrypted?","environments":["rf"],"evidence":"A classified sample of the mission's own link traffic showing what is readable.","recovery_test":"Confirm encryption can be enabled per service without breaking legacy users."}},{"id":"MSN-12","phase":"MSN","name":"Operational rhythm analysis","description":"Infer shift patterns, pass schedules, manoeuvre campaigns and critical periods such as early operations or eclipse seasons.","segments":["ground","space"],"assets":["moc","fds","people","launch"],"vectors":["rf","net","social"],"missions":[],"tier":2,"basis":"T","precondition":"Regular operations leave observable patterns in emissions, schedules or announcements.","effects":["ME-02"],"controls":["SC-05","SC-31"],"data_sources":["DS-15"],"detection":"Not directly detectable; note which critical periods are announced in advance.","assessment":{"question":"When is our team thinnest and the spacecraft least forgiving, and could an outsider predict it?","environments":["tab","osint"],"evidence":"A calendar of critical periods and how each could be predicted externally.","recovery_test":"Confirm staffing and authority to respond are no weaker in those periods."}},{"id":"MSN-13","phase":"MSN","name":"Credential and code leak mining","description":"Search public repositories, breach collections and criminal markets for mission credentials, tokens, keys and source code.","segments":["ground","supply"],"assets":["it","dev","cloud"],"vectors":["net"],"missions":[],"tier":1,"basis":"O","precondition":"Staff or suppliers have leaked secrets or reused credentials exposed elsewhere.","effects":["ME-02"],"controls":["SC-05","SC-15","SC-17","SC-21"],"data_sources":["DS-15","DS-08"],"detection":"Secret scanning of repositories; monitoring of breach data for corporate identities.","assessment":{"question":"Do any live credentials, tokens or keys for mission systems exist outside our control?","environments":["osint","auth"],"evidence":"Results of a leak search across repositories and breach data, with validity of each finding.","recovery_test":"Rotate one exposed secret end to end and measure the time and side effects."}},{"id":"EXP-01","phase":"EXP","name":"Radio capability acquisition","description":"Obtain the antennas, amplifiers and software-defined radios needed to receive from, transmit to or interfere with a space link.","segments":["link"],"assets":["tc","tm","gnss","pdl"],"vectors":["rf"],"missions":[],"tier":2,"basis":"O","precondition":"The required band and power are within reach of commercial equipment.","effects":["ME-04"],"controls":["SC-07","SC-18","SC-27"],"data_sources":["DS-05","DS-15"],"detection":"Spectrum monitoring sees test emissions; procurement is invisible to the operator.","assessment":{"question":"What equipment budget buys a credible uplink or interference capability against each of our links?","environments":["tab","rf"],"evidence":"A link-budget estimate of adversary capability per link, with assumptions.","recovery_test":"Not applicable; use the result to size margin and authentication requirements."}},{"id":"EXP-02","phase":"EXP","name":"Ground-station service acquisition","description":"Buy, borrow or fraudulently obtain time on commercial ground stations able to reach the target's bands and orbit.","segments":["ground","link"],"assets":["cloud","gs"],"vectors":["cloud","social"],"missions":[],"tier":2,"basis":"T","precondition":"Providers sell antenna time with limited checks on which spacecraft a customer may contact.","effects":["ME-01"],"controls":["SC-03","SC-21","SC-07"],"data_sources":["DS-09"],"detection":"Provider-side licensing checks; operator-side detection of unexpected uplink carriers.","assessment":{"question":"Would our provider let another customer point at and transmit to our spacecraft?","environments":["tab","range"],"evidence":"Provider's written controls on licence verification and transmit authorisation.","recovery_test":"Confirm spacecraft authentication holds even if a compliant station transmits on our frequency."}},{"id":"EXP-03","phase":"EXP","name":"Target replica construction","description":"Build a working copy of the target from commercial components, open flight software and recovered documentation to rehearse against.","segments":["space","supply"],"assets":["fsw","obc","cots"],"vectors":["supply","net"],"missions":[],"tier":3,"basis":"D","precondition":"Components or software used by the mission are commercially or openly available.","effects":["ME-02"],"controls":["SC-02","SC-17","SC-05"],"data_sources":["DS-15","DS-10"],"detection":"Unusual purchases reported by vendors; otherwise not detectable.","assessment":{"question":"How much of our flight stack could a third party run on its own bench?","environments":["tab"],"evidence":"A list of flight components and software an outsider could acquire, with versions.","recovery_test":"Not applicable; assume rehearsal is possible and rely on keys, not novelty."}},{"id":"EXP-04","phase":"EXP","name":"Flight software vulnerability research","description":"Analyse flight software obtained from updates, development kits, partners or open source for flaws reachable by command or data.","segments":["space"],"assets":["fsw","obc"],"vectors":["net","supply"],"missions":[],"tier":3,"basis":"D","precondition":"The adversary has a copy of the flight software or the framework it is built on.","effects":["ME-01"],"controls":["SC-06","SC-17","SC-11","SC-26"],"data_sources":["DS-10"],"detection":"Not detectable; rely on your own testing finding the same flaws first.","assessment":{"question":"Has our command and data handling code been tested against malformed input from every external interface?","environments":["hil","twin"],"evidence":"Fuzzing and review coverage reports for command, file-transfer and payload interfaces.","recovery_test":"Patch one finding through the normal upload path on a flatsat and time the full cycle."}},{"id":"EXP-05","phase":"EXP","name":"User terminal teardown and firmware extraction","description":"Buy a terminal, :[],"tier":3,"basis":"D","precondition":"The design predates modern link security or has an unprotected fallback mode.","effects":["ME-01","ME-02"],"controls":["SC-07","SC-08","SC-10","SC-09"],"data_sources":["DS-05","DS-10"],"detection":"Not detectable; found by design review and lab testing.","assessment":{"question":"Is there any mode, including safe mode and early operations, in which commands are accepted without authentication?","environments":["rf","hil"],"evidence":"A matrix of spacecraft modes against authentication, encryption and anti-replay state.","recovery_test":"Confirm keys can be changed if an algorithm or key is found weak."}},{"id":"EXP-08","phase":"EXP","name":"Access purchase from brokers","description":"Buy working remote access, sessions or credentials for a space organisation or its supplier from criminal access brokers.","segments":["ground","supply"],"assets":["it","net","cloud"],"vectors":["net"],"missions":[],"tier":1,"basis":"O","precondition":"A device or account in the organisation is already compromised by commodity malware or phishing.","effects":["ME-02"],"controls":["SC-15","SC-29","SC-16"],"data_sources":["DS-08","DS-15"],"detection":"Threat-intelligence monitoring of access sales; sign-ins from unfamiliar infrastructure.","assessment":{"question":"If one employee's saved sessions were stolen today, what could the buyer reach?","environments":["tab","auth"],"evidence":"Session and token inventory for a sample of privileged users, with lifetime and reach.","recovery_test":"Invalidate all sessions for a test user and confirm access ends everywhere."}},{"id":"EXP-09","phase":"EXP","name":"Tainted component or software staging","description":"Prepare altered hardware, firmware or software to be introduced through a supplier, distributor or open-source project.","segments":["supply"],"assets":["cots","dev"],"vectors":["supply"],"missions":[],"tier":4,"basis":"T","precondition":"A supplier or project in the mission's chain accepts contr
