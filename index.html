"],"vectors":["net"],"missions":[],"tier":4,"basis":"T","precondition":"Rekey or credential-change functions can be used by the adversary.","effects":["ME-01","ME-09","ME-12"],"controls":["SC-10","SC-13","SC-33","SC-34"],"data_sources":["DS-01","DS-08"],"detection":"Rekey events without an approved ceremony; authentication failures from legitimate stations.","assessment":{"question":"Is there a protected last-resort way to regain command if operational keys are changed against us?","environments":["hil","tab"],"evidence":"Design and test evidence of a recovery key or path that normal operations cannot alter.","recovery_test":"Regain command of the flatsat after operational keys are replaced."}},{"id":"RSL-05","phase":"RSL","name":"Denial of alternate command paths","description":"Jam, compromise or pre-empt the backup stations and networks the operator would turn to in a crisis.","segments":["link","ground"],"assets":["gs","tc","net"],"vectors":["rf","net"],"missions":[],"tier":3,"basis":"T","precondition":"Backup paths share providers, credentials, locations or frequencies with the primary.","effects":["ME-04","ME-01"],"controls":["SC-33","SC-36","SC-27","SC-03"],"data_sources":["DS-05","DS-06"],"detection":"Health monitoring of backup paths; periodic live use.","assessment":{"question":"What do the primary and backup command paths have in common?","environments":["tab","twin"],"evidence":"A common-mode analysis of primary and alternate paths.","recovery_test":"Command through the alternate path with the shared elements declared lost."}},{"id":"RSL-06","phase":"RSL","name":"Interference with incident response","description":"Watch responder communications, tamper with response tooling or feed false information to slow and misdirect the response.","segments":["ground"],"assets":["it","people","moc"],"vectors":["net","social"],"missions":[],"tier":3,"basis":"O","precondition":"Responders use the same systems the adversary already controls.","effects":["ME-12","ME-06"],"controls":["SC-31","SC-28","SC-15","SC-29"],"data_sources":["DS-08","DS-07"],"detection":"Access to responder mailboxes and tickets; security tools being reconfigured.","assessment":{"question":"Could we run an incident without using any system the intruder might control?","environments":["tab","range"],"evidence":"An out-of-band communications plan and evidence it has been used in an exercise.","recovery_test":"Run one exercise entirely on out-of-band channels."}},{"id":"RSL-07","phase":"RSL","name":"Re-entry through unrotated trust","description":"Return after eviction using credentials, keys, tokens or vendor connections that were not changed during recovery.","segments":["ground","supply","space"],"assets":["it","kms","cots","crypto"],"vectors":["net","supply"],"missions":[],"tier":3,"basis":"O","precondition":"Recovery restores service faster than it rotates secrets.","effects":["ME-12","ME-01"],"controls":["SC-10","SC-15","SC-03","SC-31"],"data_sources":["DS-08","DS-10"],"detection":"Use of pre-incident credentials or keys after recovery.","assessment":{"question":"After an incident, what is the complete list of secrets to rotate, including on orbit and at suppliers?","environments":["tab","range"],"evidence":"A rotation checklist with owners and a timed dry run.","recovery_test":"Complete a full rotation in an exercise and verify old secrets fail everywhere."}},{"id":"RSL-08","phase":"RSL","name":"Timing against critical operations","description":"Strike during launch and early operations, manoeuvres, anomaly recovery or holidays, when margin and attention are lowest.","segments":["ground","space"],"assets":["moc","people","fds","launch"],"vectors":["net","rf"],"missions":[],"tier":3,"basis":"T","precondition":"Critical periods are predictable and staffing or authority is reduced.","effects":["ME-04","ME-09","ME-10"],"controls":["SC-31","SC-36","SC-01","SC-13"],"data_sources":["DS-15","DS-01"],"detection":"Heightened monitoring during critical periods; intelligence warnings.","assessment":{"question":"During our most delicate operation, who has authority to stop and switch to a safe configuration?","environments":["tab"],"evidence":"Go and no-go criteria that include security conditions for critical operations.","recovery_test":"Inject a security event into a critical-operations rehearsal."}},{"id":"RSL-09","phase":"RSL","name":"Common-mode defeat of redundancy","description":"Defeat spares and redundant chains by exploiting what they share: identical software, keys, suppliers or management.","segments":["space","ground"],"assets":["obc","fsw","gs","moc"],"vectors":["net","supply"],"missions":[],"tier":4,"basis":"T","precondition":"Redundancy was designed against random failure, not deliberate common cause.","effects":["ME-09","ME-04","ME-11"],"controls":["SC-36","SC-02","SC-17","SC-34"],"data_sources":["DS-04","DS-10"],"detection":"Simultaneous anomalies in primary and redundant units.","assessment":{"question":"What single flaw is present in both the primary and the backup?","environments":["tab","twin"],"evidence":"A common-cause analysis covering software, keys, suppliers and operations.","recovery_test":"Operate with primary and identical backup both declared untrusted."}},{"id":"RSL-10","phase":"RSL","name":"Erosion of assurance and attribution","description":"Leave doubt: imitate natural anomalies, plant misleading traces or simply make it impossible to prove the system is clean.","segments":["space","ground"],"assets":["moc","fsw","people"],"vectors":["net","rf","social"],"missions":[],"tier":3,"basis":"T","precondition":"The operator cannot independently attest spacecraft state or distinguish attack from fault.","effects":["ME-12","ME-06"],"controls":["SC-26","SC-34","SC-25","SC-31","SC-29"],"data_sources":["DS-04","DS-13","DS-15"],"detection":"Anomaly investigation that always includes a security hypothesis.","assessment":{"question":"After an anomaly, how would we prove to a customer that it was not an intrusion?","environments":["tab"],"evidence":"An anomaly procedure with a security branch and the evidence it collects.","recovery_test":"Produce an attestation of spacecraft state from independent evidence in an exercise."}}],"controls":[{"id":"SC-01","function":"GV","name":"Mission-driven threat modelling","description":"Maintain a threat model that starts from mission objectives and names an owner for each risk across all segments.","verify":"Pick one attack path and confirm the model predicted it, an owner exists and the residual risk was accepted in writing.","references":["NIST IR 8270","CCSDS 350.1-G","NASA Space Security Best Practices Guide"]},{"id":"SC-02","function":"GV","name":"Supply chain assurance and bills of materials","description":"Require software and hardware bills of materials, provenance evidence and security terms from every supplier of flight and ground items.","verify":"Trace one flight component and one ground product back to source and show the bill of materials matches what is installed.","references":["NIST SP 800-161","NIST IR 8270","Space Policy Directive-5"]},{"id":"SC-03","function":"GV","name":"Security terms for shared and third-party services","description":"Contract for isolation, logging, incident notification and exit rights with ground-station, cloud and managed-service providers.","verify":"Ask the provider for tenant-isolation evidence and your own audit logs for a named pass; time how long it takes.","references":["NIST IR 8401","ISO/IEC 27036"]},{"id":"SC-04","function":"ID","name":"Mission dependency and trust-boundary map","description":"Keep a current map of assets, data flows, radio links and trust boundaries, including those owned by others.","verify":"Walk a command from operator console to actuator and check every hop and key appears on the map.","references":["NIST IR 8401","NIST CSF 2.0 ID.AM"]},{"id":"SC-05","function":"ID","name":"Public exposure management","description":"Review what filings, papers, job adverts, repositories and internet scans reveal, and remove or accept each item.","verify":"Have an outsider build a target pack from public sources in a day and compare it with your own list.","references":["NIST CSF 2.0 ID.RA","ENISA Space Threat Landscape"]},{"id":"SC-06","function":"ID","name":"Vulnerability management for flight and ground","description":"Track vulnerabilities in flight software, ground products and terminals, with a decision for assets that cannot be patched.","verify":"Select a recent advisory for a ground product in use and show time to triage, decision and closure.","references":["NIST IR 8401","NIST SP 800-40"]},{"id":"SC-07","function":"PR","name":"Authenticated telecommand","description":"Authenticate every telecommand at the link layer so the spacecraft only acts on frames from a holder of the mission key.","verify":"In a lab, send a well-formed but unauthenticated command and confirm it is rejected and reported in telemetry.","references":["CCSDS 355.0-B (SDLS)","CCSDS 352.0-B","BSI TR-03184"]},{"id":"SC-08","function":"PR","name":"Link encryption","description":"Encrypt telecommand, telemetry and payload links wherever mission and regulation allow, using reviewed algorithms.","verify":"Capture a downlink in the lab and confirm no housekeeping or user data is readable without keys.","references":["CCSDS 352.0-B","CCSDS 355.0-B (SDLS)","CNSSP-12"]},{"id":"SC-09","function":"PR","name":"Anti-replay protection","description":"Bind commands to counters or time windows so a recorded frame cannot be accepted twice or out of order.","verify":"Replay a previously accepted command in the lab and confirm rejection and counter behaviour across a reboot.","references":["CCSDS 355.0-B (SDLS)"]},{"id":"SC-10","function":"PR","name":"Key management and on-orbit rekey","description":"Generate, store, rotate and revoke keys under hardware protection, with a rehearsed way to rekey spacecraft in orbit.","verify":"Rehearse a key compromise: rotate the active key on a flatsat and measure time and operator steps.","references":["CCSDS 355.1-B","NIST SP 800-57","BSI TR-03184"]},{"id":"SC-11","function":"PR","name":"Signed updates and secure boot","description":"Accept only cryptographically signed software, firmware and bitstreams, verified at load and at boot from an immutable root.","verify":"Attempt to load an unsigned and a wrongly signed image on a test unit and confirm both are refused and logged.","references":["NIST SP 800-193","BSI TR-03184"]},{"id":"SC-12","function":"PR","name":"On-board partitioning and least privilege","description":"Separate payload, hosted and platform functions so a fault or compromise in one cannot command another.","verify":"From the payload interface on a flatsat, try to address platform functions and confirm the bus gateway blocks it.","references":["NIST IR 8270","ECSS-E-ST-40C","BSI TR-03184"]},{"id":"SC-13","function":"PR","name":"Critical-command authorisation","description":"Classify hazardous commands and require independent approval or an arming sequence before they execute.","verify":"Try to issue a hazardous command with one operator account and confirm the system demands a second approval.","references":["NASA-STD-1006","NIST IR 8401"]},{"id":"SC-14","function":"PR","name":"Ground network segmentation","description":"Isolate mission operations, station equipment and enterprise IT, with tightly defined and monitored crossings.","verify":"From an enterprise workstation, enumerate reachable mission services; the expected answer is none.","references":["NIST IR 8401","IEC 62443-3-3","NIST SP 800-82"]},{"id":"SC-15","function":"PR","name":"Strong identity for mission operations","description":"Require phishing-resistant multi-factor sign-in, privileged-access workstations and session recording for mission roles.","verify":"Review last month's mission-enclave sign-ins for any single-factor, shared or unowned account.","references":["NIST SP 800-63B","NIST IR 8401"]},{"id":"SC-16","function":"PR","name":"Hardened stations, modems and remote access","description":"Harden and patch internet-facing appliances, modems, baseband units and antenna controllers; remove default access.","verify":"Scan your own address space and station subnets for management interfaces and default credentials.","references":["NIST IR 8401","CIS Controls v8"]},{"id":"SC-17","function":"PR","name":"Secure development and toolchain integrity","description":"Protect source, build and signing systems; use reviewed changes, reproducible builds and separated signing keys.","verify":"Rebuild a released flight image from source on a clean machine and compare hashes with what was flown.","references":["NIST SP 800-218 (SSDF)","SLSA","ECSS-Q-ST-80C"]},{"id":"SC-18","function":"PR","name":"Interference-resistant links and navigation","description":"Use spreading, hopping, directional antennas, power margin and authenticated navigation signals to resist jamming and spoofing.","verify":"Inject calibrated interference in a cabled test and record the margin at which the link or fix is lost.","references":["NIST IR 8323","CCSDS 350.1-G","Galileo OSNMA"]},{"id":"SC-19","function":"PR","name":"User terminal and fleet-management hardening","description":"Sign terminal firmware, isolate the management plane from user traffic and rate-limit fleet-wide actions.","verify":"Try to push a configuration to more than a set fraction of test terminals at once and confirm a brake engages.","references":["NIST IR 8441","ETSI EN 303 645"]},{"id":"SC-20","function":"PR","name":"Physical and hardware tamper protection","description":"Control physical access to sites and hardware; disable debug ports and design against fault injection where exposure is high.","verify":"Inspect a terminal or test unit for live debug interfaces and unattended access routes at a remote site.","references":["NIST SP 800-53 PE","BSI TR-03184"]},{"id":"SC-21","function":"PR","name":"Cloud tenant isolation and API security","description":"Scope cloud and service credentials tightly, rotate them, and verify tenant separation for scheduling, data and keys.","verify":"Use a deliberately over-used test credential and confirm it cannot see or schedule another mission's contacts.","references":["CSA CCM v4","NIST IR 8401"]},{"id":"SC-22","function":"PR","name":"Data integrity and provenance","description":"Sign or seal mission products and operational data such as ephemerides so recipients can detect alteration.","verify":"Alter one byte of a test product and an orbit file in staging and confirm downstream consumers reject them.","references":["NIST IR 8270","NIST SP 800-53 SI-7"]},{"id":"SC-23","function":"PR","name":"Personnel security and insider-risk programme","description":"Vet, train and support staff and contractors; watch for coercion and separate duties for sensitive roles.","verify":"Check whether one person could alone change flight software and release it to operations.","references":["NIST SP 800-53 PS","CISA Insider Threat Mitigation Guide"]},{"id":"SC-24","function":"PR","name":"Authenticated crosslinks and mesh routing","description":"Authenticate and authorise inter-satellite traffic so one spacecraft cannot command or reroute its neighbours.","verify":"In a constellation simulator, let one node misbehave and confirm neighbours reject its control traffic.","references":["NIST IR 8441","CCSDS 355.0-B (SDLS)"]},{"id":"SC-25","function":"DE","name":"Command and telemetry anomaly detection","description":"Reconcile commands sent with commands received and check telemetry for physically implausible values and patterns.","verify":"Inject an unlogged command in a twin and measure how long before an analyst is alerted.","references":["NIST IR 8270","NIST CSF 2.0 DE.CM"]},{"id":"SC-26","function":"DE","name":"On-board integrity monitoring","description":"Monitor memory, tables and execution on board, and report or act on unexpected change.","verify":"Modify a table on a flatsat outside the normal procedure and confirm the change is flagged in telemetry.","references":["NIST IR 8270","DHS S&T on-board detection research"]},{"id":"SC-27","function":"DE","name":"Spectrum monitoring and interference geolocation","description":"Monitor carriers and noise floors for unexpected emitters and keep a route to geolocate and report interference.","verify":"Introduce a test carrier in a monitored band and time detection, characterisation and escalation.","references":["ITU Radio Regulations Art. 15","NIST IR 8323"]},{"id":"SC-28","function":"DE","name":"Mission-aware security operations","description":"Feed mission control, station and identity logs to analysts who understand space protocols and operations tempo.","verify":"Ask the SOC to explain an out-of-window command burst from last month's logs within an hour.","references":["NIST IR 8401","NIST CSF 2.0 DE.AE"]},{"id":"SC-29","function":"DE","name":"Threat intelligence and sector sharing","description":"Consume and contribute space-sector threat reporting and act on indicators and warnings.","verify":"Trace the last sector advisory received to a concrete change or a recorded decision not to act.","references":["Space ISAC","EU Space ISAC","NIST CSF 2.0 ID.RA"]},{"id":"SC-30","function":"DE","name":"Navigation and timing integrity monitoring","description":"Cross-check position and time against independent sources and alarm on divergence.","verify":"Offset one timing source in a lab and confirm the alarm fires and the system holds over on a trusted source.","references":["NIST IR 8323","RTCA DO-235"]},{"id":"SC-31","function":"RS","name":"Space-specific incident response","description":"Maintain response plans that cover spacecraft, links and providers, with pre-agreed authority to act during a pass.","verify":"Run a timed exercise in which control of one spacecraft is in doubt and record every decision delay.","references":["NIST SP 800-61r3","NIST IR 8401"]},{"id":"SC-32","function":"RS","name":"Cyber-aware safe mode","description":"Give the spacecraft a minimal, well-protected state that keeps authentication on and can refuse an untrusted ground.","verify":"Force safe mode on a flatsat and confirm command authentication, counters and logging remain enforced.","references":["NASA-STD-1006","NIST IR 8270"]},{"id":"SC-33","function":"RS","name":"Alternate command paths and sites","description":"Hold a geographically and administratively separate way to command the spacecraft with its own credentials.","verify":"Command a test spacecraft or twin from the alternate site with the primary site declared lost.","references":["NIST IR 8401","NIST SP 800-34"]},{"id":"SC-34","function":"RC","name":"Trusted recovery of spacecraft software","description":"Keep an immutable known-good image and a verified procedure to restore and attest flight software.","verify":"Corrupt the active image on a flatsat and restore from the protected image; verify by measurement, not by telemetry alone.","references":["NIST SP 800-193","NIST IR 8270"]},{"id":"SC-35","function":"RC","name":"Ground backup and rebuild","description":"Keep offline, tested backups of mission systems, databases, procedures and key material, and rehearse rebuild.","verify":"Rebuild the mission control system from backups on clean hardware and command a simulator.","references":["NIST SP 800-34","NIST IR 8401"]},{"id":"SC-36","function":"RC","name":"Mission continuity and graceful degradation","description":"Design for degraded service: spares, alternative providers, fallback navigation and user communication plans.","verify":"Remove one spacecraft, one station or one provider in an exercise and measure service delivered to users.","references":["NIST IR 8441","NIST IR 8323","EU NIS2 Directive"]}],"mission_effects":[{"id":"ME-01","name":"Loss of command authority","description":"The operator can no longer be sure it is the only party commanding the asset.","property":"control"},{"id":"ME-02","name":"Loss of confidentiality","description":"Mission, user or design information is exposed to an unauthorised party.","property":"confidentiality"},{"id":"ME-03","name":"Loss of data integrity","description":"Data, parameters or products are altered and may be trusted wrongly.","property":"integrity"},{"id":"ME-04","name":"Service outage","description":"The mission service is unavailable to some or all users.","property":"availability"},{"id":"ME-05","name":"Service degradation","description":"The service continues with reduced capacity, accuracy or timeliness.","property":"availability"},{"id":"ME-06","name":"Loss of health visibility","description":"The operator cannot see, or cannot trust, the true state of the spacecraft.","property":"integrity"},{"id":"ME-07","name":"Loss of navigation and timing trust","description":"Position or time delivered to users or used by the system is wrong or unavailable.","property":"integrity"},{"id":"ME-08","name":"Recoverable asset degradation","description":"Consumables, lifetime or performance are spent but the asset can be recovered.","property":"availability"},{"id":"ME-09","name":"Permanent asset loss","description":"A spacecraft, terminal fleet or ground capability is lost beyond recovery.","property":"availability"},{"id":"ME-10","name":"Safety and collision risk","description":"Risk to people, to other spacecraft or to the orbital environment.","property":"safety"},{"id":"ME-11","name":"Downstream cascade","description":"Customers and dependent sectors lose a service they rely on.","property":"availability"},{"id":"ME-12","name":"Loss of assurance","description":"The operator cannot prove the system is in a trusted state, even if it works.","property":"control"}],"data_sources":[{"id":"DS-01","name":"Command history and verification","description":"Ground command logs reconciled with on-board command counters and acknowledgements."},{"id":"DS-02","name":"Housekeeping telemetry","description":"Bus and payload health parameters and their trends."},{"id":"DS-03","name":"On-board events and fault records","description":"Event logs, fault-protection activations and reboot causes."},{"id":"DS-04","name":"Memory and image integrity","description":"Checksums, dumps and attestation of on-board software and tables."},{"id":"DS-05","name":"Spectrum and link metrics","description":"Carrier monitoring, signal-to-noise, receiver lock and gain-control values."},{"id":"DS-06","name":"Ground network traffic","description":"Flow and packet data, including space-protocol-aware inspection."},{"id":"DS-07","name":"Ground host and application logs","description":"Endpoint, mission-control and station software logs."},{"id":"DS-08","name":"Identity and remote-access logs","description":"Directory, sign-in, VPN and privileged-session records."},{"id":"DS-09","name":"Cloud and service audit logs","description":"Provider audit trails for scheduling, API use and data access."},{"id":"DS-10","name":"Build and supply chain records","description":"Source history, build logs, signatures and bills of materials."},{"id":"DS-11","name":"Navigation and timing observables","description":"Receiver measurements cross-checked against independent sources."},{"id":"DS-12","name":"Terminal fleet telemetry","description":"Terminal status, firmware versions and network-management logs."},{"id":"DS-13","name":"Orbit and tracking data","description":"Operator ephemerides compared with independent tracking."},{"id":"DS-14","name":"Physical access records","description":"Site access logs, video and tamper indications."},{"id":"DS-15","name":"External intelligence","description":"Open-source, sector-sharing and exposure-monitoring reports."},{"id":"DS-16","name":"Mission product quality checks","description":"Validation of payload data and products against expectations."}],"actors":[{"id":"TA-01","name":"Sandworm","aliases":["APT44","Seashell Blizzard","GRU Unit 74455"],"type":"state","origin":"Russia","tier":4,"motivation":"Disruption in support of military operations","summary":"Russian military intelligence unit publicly blamed by the US, UK and EU for the February 2022 attack on the KA-SAT network, in which tens of thousands of modems were disabled. Researchers linked the AcidRain wiper used there, and the later AcidPour variant, to the group's tooling.","techniques":[{"id":"MSN-10","basis":"A"},{"id":"POS-02","basis":"R"},{"id":"TRN-01","basis":"R"},{"id":"CTL-11","basis":"R"},{"id":"SRV-08","basis":"R"},{"id":"EFX-04","basis":"R"},{"id":"EFX-05","basis":"R"}],"sources":["Viasat, KA-SAT Network cyber attack overview (30 March 2022)","SentinelLabs, AcidRain: A Modem Wiper Rains Down on Europe (2022)","Council of the EU, UK FCDO and US State Department statements (10 May 2022)"]},{"id":"TA-02","name":"Turla","aliases":["Secret Blizzard","Venomous Bear","Snake"],"type":"state","origin":"Russia","tier":4,"motivation":"Espionage","summary":"Long-running espionage group attributed to Russia's FSB. Kaspersky documented its use of other parties' unencrypted satellite internet downlinks to receive stolen data and hide its control servers.","techniques":[{"id":"MSN-11","basis":"R"},{"id":"MNP-03","basis":"R"},{"id":"POS-01","basis":"R"},{"id":"MNP-14","basis":"A"}],"sources":["Kaspersky GReAT, Satellite Turla: APT Command and Control in the Sky (2015)"]},{"id":"TA-03","name":"APT28","aliases":["Fancy Bear","Forest Blizzard","GRU Unit 26165"],"type":"state","origin":"Russia","tier":4,"motivation":"Espionage","summary":"Russian military intelligence group with a long record against aerospace and defence. CISA incident responders said in late 2022 that they had found the group inside the network of a US satellite communications provider.","techniques":[{"id":"POS-01","basis":"R"},{"id":"POS-03","basis":"R"},{"id":"POS-02","basis":"R"},{"id":"TRN-01","basis":"A"},{"id":"SRV-03","basis":"A"},{"id":"MNP-14","basis":"R"}],"sources":["CyberScoop, CISA researchers: Russia's Fancy Bear infiltrated US satellite network (December 2022)"]},{"id":"TA-04","name":"Thrip","aliases":["Lotus Blossom (linked)","Billbug (linked)"],"type":"state","origin":"China (vendor-assessed)","tier":3,"motivation":"Espionage, with interest in operational systems","summary":"Symantec reported in 2018 that this group had compromised a satellite communications operator and sought out machines running software that monitors and controls satellites, relying heavily on built-in administration tools.","techniques":[{"id":"POS-01","basis":"A"},{"id":"SRV-08","basis":"R"},{"id":"TRN-01","basis":"R"},{"id":"CTL-08","basis":"A"},{"id":"MNP-14","basis":"R"}],"sources":["Symantec, Thrip: Espionage Group Hits Satellite, Telecoms, and Defense Companies (2018)"]},{"id":"TA-05","name":"Salt Typhoon","aliases":["Earth Estries (overlap)","GhostEmperor (overlap)"],"type":"state","origin":"China","tier":4,"motivation":"Espionage against communications providers","summary":"Group behind the wide compromise of telecommunications carriers disclosed in 2024. In June 2025 Bloomberg reported satellite operator Viasat among the victims; Viasat confirmed unauthorised access through a compromised device and said it found no customer impact.","techniques":[{"id":"POS-02","basis":"R"},{"id":"CTL-08","basis":"R"},{"id":"SRV-03","basis":"R"},{"id":"MNP-13","basis":"R"},{"id":"MNP-14","basis":"A"}],"sources":["Via Satellite, Viasat confirms unauthorized access after Bloomberg report of Salt Typhoon impact (18 June 2025)"]},{"id":"TA-06","name":"Peach Sandstorm","aliases":["APT33","Refined Kitten","Elfin"],"type":"state","origin":"Iran (IRGC)","tier":3,"motivation":"Espionage","summary":"Iranian group that Microsoft observed password-spraying satellite, defence and pharmaceutical organisations in 2023 and deploying the Tickler backdoor against satellite and communications-equipment targets in 2024. In 2026 it was reported using a space-conference theme in phishing against aerospace companies.","techniques":[{"id":"POS-03","basis":"R"},{"id":"POS-01","basis":"R"},{"id":"EXP-10","basis":"R"},{"id":"SRV-03","basis":"R"},{"id":"MNP-14","basis":"R"}],"sources":["Microsoft Threat Intelligence, Peach Sandstorm password spray campaigns (September 2023)","Microsoft Threat Intelligence, Peach Sandstorm deploys new custom Tickler malware (August 2024)","Via Satellite, The Space Sector Under Cyber Fire in the US-Israel-Iran War (17 June 2026)"]},{"id":"TA-07","name":"Lazarus cluster","aliases":["Hidden Cobra","Diamond Sleet","Andariel (related)"],"type":"state","origin":"North Korea","tier":3,"motivation":"Espionage and technology acquisition","summary":"North Korean groups that repeatedly target aerospace and defence engineers with fake job offers, and that a 2024 multi-government advisory described as seeking aerospace, satellite and related technical data.","techniques":[{"id":"POS-01","basis":"R"},{"id":"EXP-10","basis":"R"},{"id":"POS-05","basis":"R"},{"id":"SRV-03","basis":"A"},{"id":"MNP-14","basis":"R"}],"sources":["ESET, Operation In(ter)ception (2020)","CISA and partners, joint advisory on Andariel (July 2024)"]},{"id":"TA-08","name":"Space Pirates","aliases":[],"type":"state","origin":"China (vendor-assessed)","tier":3,"motivation":"Espionage","summary":"Group named by Positive Technologies in 2022 for a campaign of phishing and custom backdoors against Russian aerospace organisations.","techniques":[{"id":"POS-01","basis":"R"},{"id":"SRV-03","basis":"R"},{"id":"MNP-14","basis":"R"}],"sources":["Positive Technologies, Space Pirates: analyzing the tools and connections of a new hacker group (2022)"]},{"id":"TA-09","name":"State electronic-warfare forces","aliases":[],"type":"state","origin":"Several states","tier":4,"motivation":"Denial and deception in and around conflict zones","summary":"Military units operating jammers and spoofers. Public reporting covers persistent navigation interference around the Baltic, Black Sea and Middle East, jamming of commercial satellite broadband in Ukraine, and interference with broadcast satellites raised at the ITU in 2024.","techniques":[{"id":"MSN-03","basis":"A"},{"id":"EXP-01","basis":"A"},{"id":"EFX-01","basis":"R"},{"id":"EFX-02","basis":"R"},{"id":"EFX-03","basis":"R"},{"id":"MNP-09","basis":"R"},{"id":"EFX-11","basis":"R"}],"sources":["ITU Radio Regulations Board decisions on harmful interference (2024)","EASA and IATA statements on GNSS interference (2024)"]},{"id":"TA-10","name":"Mobir","aliases":["Cyberban News (channel)"],"type":"state-linked","origin":"Iran (IRGC link reported)","tier":2,"motivation":"Disruption and intimidation during conflict","summary":"Persona that in March and April 2026 claimed intrusions and data destruction at Gulf satellite operators and a space agency. Analysts linked it to the IRGC; a released screen recording partly supported one claim, and others remain unverified.","techniques":[{"id":"POS-04","basis":"C"},{"id":"MNP-13","basis":"C"},{"id":"MNP-14","basis":"C"},{"id":"EFX-05","basis":"C"},{"id":"EFX-15","basis":"A"}],"sources":["Via Satellite, The Space Sector Under Cyber Fire in the US-Israel-Iran War (17 June 2026)"]},{"id":"TA-11","name":"Handala","aliases":[],"type":"state-linked","origin":"Iran (MOIS link reported)","tier":2,"motivation":"Intimidation and hack-and-leak","summary":"Persona reported to have messaged employees of an aerospace prime in Israel in March 2026 claiming their personal data was breached, and to have published names of purported geospatial-intelligence staff.","techniques":[{"id":"MSN-08","basis":"R"},{"id":"MNP-14","basis":"C"},{"id":"EFX-14","basis":"A"}],"sources":["Via Satellite, The Space Sector Under Cyber Fire in the US-Israel-Iran War (17 June 2026)"]},{"id":"TA-12","name":"Lab Dookhtegan","aliases":["Read My Lips"],"type":"hacktivist","origin":"Anti-Iranian-government","tier":2,"motivation":"Disruption of Iranian state-linked logistics","summary":"Group that claimed in March 2025 to have cut satellite communications on 116 Iranian tankers and cargo ships by attacking their maritime terminal systems, and claimed a second wave later that year.","techniques":[{"id":"POS-10","basis":"C"},{"id":"CTL-11","basis":"C"},{"id":"EFX-04","basis":"C"}],"sources":["The Maritime Executive, Cyber Hackers Claim to Have Disabled Iranian Ship Communications (March 2025)"]},{"id":"TA-13","name":"Killnet","aliases":[],"type":"hacktivist","origin":"Pro-Russian","tier":1,"motivation":"Publicity and harassment","summary":"Pro-Russian collective known for denial-of-service campaigns; it claimed an attack on a satellite broadband provider's customer sign-in service in November 2022.","techniques":[{"id":"EFX-15","basis":"C"}],"sources":["Trustwave SpiderLabs reporting on Killnet claims (November 2022)"]},{"id":"TA-14","name":"GhostSec","aliases":[],"type":"hacktivist","origin":"Mixed","tier":1,"motivation":"Publicity","summary":"Group that in 2023 claimed to have accessed and wiped internet-exposed satellite navigation receivers.","techniques":[{"id":"MSN-10","basis":"C"},{"id":"POS-02","basis":"C"}],"sources":["Cyble, GhostSec targeting satellite receivers (March 2023)"]},{"id":"TA-15","name":"Network Battalion 65","aliases":["NB65"],"type":"hacktivist","origin":"Pro-Ukrainian","tier":1,"motivation":"Publicity and disruption","summary":"Group that in March 2022 claimed to have taken files from, and disrupted, a system at Russia's space agency. The agency's then director denied that control systems were affected.","techniques":[{"id":"POS-02","basis":"C"},{"id":"MNP-02","basis":"C"}],"sources":["Media reporting of NB65 claims and Roscosmos denial (March 2022)"]},{"id":"TA-16","name":"Dozor-Teleport intruders","aliases":[],"type":"hacktivist","origin":"Self-described Wagner-aligned","tier":2,"motivation":"Disruption","summary":"Unidentified actors who claimed the June 2023 attack on a Russian satellite communications provider, saying they damaged user terminals and leaked files. Network measurements confirmed an outage; the claimed affiliation was not verified.","techniques":[{"id":"POS-02","basis":"A"},{"id":"CTL-11","basis":"C"},{"id":"EFX-04","basis":"C"},{"id":"EFX-05","basis":"C"},{"id":"MNP-14","basis":"C"}],"sources":["The Record, Hackers claim to take down Russian satellite communications provider (June 2023)"]},{"id":"TA-17","name":"Ransomware and data-extortion crews","aliases":["Scattered Lapsus$ Hunters","LockBit","DoppelPaymer","Play","Medusa"],"type":"criminal","origin":"Various","tier":2,"motivation":"Money","summary":"Financially motivated groups that reach space companies mostly through suppliers. Space ISAC tracked close to seventy claimed attacks on the sector in the first part of 2026, more than half against manufacturers, contractors and integrators.","techniques":[{"id":"MSN-13","basis":"R"},{"id":"EXP-08","basis":"R"},{"id":"POS-01","basis":"R"},{"id":"POS-03","basis":"R"},{"id":"CTL-08","basis":"R"},{"id":"MNP-02","basis":"R"},{"id":"MNP-14","basis":"R"},{"id":"RSL-03","basis":"R"},{"id":"EFX-05","basis":"R"},{"id":"EFX-14","basis":"R"}],"sources":["Space ISAC, Threat Briefing 46: Data Extortion Actors and Initial Access Brokers (June 2026)"]},{"id":"TA-18","name":"Initial access brokers","aliases":[],"type":"criminal","origin":"Various","tier":1,"motivation":"Money","summary":"Sellers of stolen credentials, sessions and remote access. Space ISAC notes access to space-sector suppliers being sold and reaching leak sites within weeks.","techniques":[{"id":"MSN-13","basis":"R"},{"id":"EXP-08","basis":"R"},{"id":"POS-02","basis":"R"},{"id":"POS-03","basis":"R"}],"sources":["Space ISAC, Threat Briefing 46: Data Extortion Actors and Initial Access Brokers (June 2026)"]},{"id":"TA-19","name":"Malicious or coerced insider","aliases":[],"type":"insider","origin":"Any","tier":2,"motivation":"Grievance, money or coercion","summary":"A generic actor class: someone with legitimate access to operations, keys, build systems or sites. Included so that assessments test separation of duties rather than only the perimeter.","techniques":[{"id":"EXP-12","basis":"A"},{"id":"POS-13","basis":"A"},{"id":"CTL-03","basis":"A"},{"id":"CTL-14","basis":"A"},{"id":"SRV-05","basis":"A"},{"id":"MNP-10","basis":"A"}],"sources":["CISA, Insider Threat Mitigation Guide"]},{"id":"TA-20","name":"Signal pirates and broadcast intruders","aliases":[],"type":"other","origin":"Various","tier":2,"motivation":"Free capacity, protest or propaganda","summary":"Individuals and groups who transmit through satellites without permission, from the 1986 override of a US pay-television channel and long-running misuse of military UHF transponders in Brazil to wartime replacement of television programming.","techniques":[{"id":"EXP-01","basis":"R"},{"id":"MNP-11","basis":"R"},{"id":"EFX-11","basis":"R"}],"sources":["Wired, The Great Brazilian Sat-Hack Crackdown (2009)","US court records, United States v. MacDougall (1986)"]}],"incidents":[{"id":"INC-01","year":1986,"date":"April 1986","title":"Pay-television uplink override","actors":["TA-20"],"attribution":"gov","kind":"interference","segments":["link"],"techniques":["EXP-01","EFX-11"],"summary":"A teleport engineer overpowered a pay-television channel's uplink for several minutes to display a protest message. He was identified and prosecuted.","sources":[{"title":"US court records, United States v. MacDougall"}]},{"id":"INC-02","year":2008,"date":"2007 to 2008","title":"Interference with two US Earth-observation satellites","actors":[],"attribution":"unattributed","kind":"intrusion","segments":["ground","link","space"],"techniques":["POS-02","CTL-13","CTL-03"],"summary":"A US congressional commission reported that two civil Earth-observation satellites experienced interference through a commercial ground station; for one, the responsible party completed every step needed to command it but issued no commands.","sources":[{"title":"US-China Economic and Security Review Commission, 2011 Annual Report to Congress"}]},{"id":"INC-03","year":2009,"date":"March 2009","title":"Crackdown on misuse of military UHF transponders","actors":["TA-20"],"attribution":"gov","kind":"interference","segments":["link","space"],"techniques":["EXP-01","MNP-11"],"summary":"Brazilian police acted against dozens of people using modified radios to talk through ageing military communications satellites that relayed any signal in band.","sources":[{"title":"Wired, The Great Brazilian Sat-Hack Crackdown"}]},{"id":"INC-04","year":2014,"date":"2014 and 2018","title":"Research into satellite terminal firmware","actors":[],"attribution":"research","kind":"research","segments":["user"],"techniques":["EXP-05","POS-09","SRV-10"],"summary":"A researcher reported hard-coded credentials, undocumented protocols and other flaws across widely used maritime, aviation and military terminals, and later showed some could be reached from the internet.","sources":[{"title":"IOActive, A Wake-up Call for SATCOM Security (2014) and Last Call for SATCOM Security (2018)"}]},{"id":"INC-05","year":2014,"date":"Autumn 2014","title":"Breach of a weather agency's satellite data network","actors":[],"attribution":"unattributed","kind":"intrusion","segments":["ground"],"techniques":["POS-02","TRN-01","MNP-02","EFX-05"],"summary":"A US weather agency took satellite data feeds offline for unscheduled maintenance after an intrusion. Officials told the press the attack came from China; no formal attribution followed.","sources":[{"title":"Washington Post reporting, November 2014"}]},{"id":"INC-06","year":2015,"date":"September 2015","title":"Satellite links used to hide espionage infrastructure","actors":["TA-02"],"attribution":"vendor","kind":"espionage","segments":["link","user"],"techniques":["MSN-11","MNP-03"],"summary":"Researchers described an espionage group receiving stolen data by listening to other customers' unencrypted satellite internet downlinks across a wide beam.","sources":[{"title":"Kaspersky GReAT, Satellite Turla: APT Command and Control in the Sky"}]},{"id":"INC-07","year":2018,"date":"June 2018","title":"Espionage campaign reaches a satellite operator","actors":["TA-04"],"attribution":"vendor","kind":"espionage","segments":["ground"],"techniques":["SRV-08","TRN-01","MNP-14"],"summary":"A security vendor reported a group inside a satellite communications operator that appeared most interested in the systems that monitor and control satellites.","sources":[{"title":"Symantec, Thrip: Espionage Group Hits Satellite, Telecoms, and Defense Companies"}]},{"id":"INC-08","year":2020,"date":"August 2020","title":"Research: reading geostationary broadband traffic","actors":[],"attribution":"research","kind":"research","segments":["link","user"],"techniques":["MSN-11","MNP-01"],"summary":"A researcher showed that inexpensive home television equipment could capture unencrypted maritime, aviation and enterprise traffic from eighteen geostationary satellites.","sources":[{"title":"J. Pavur, Whispers Among the Stars, Black Hat USA 2020"}]},{"id":"INC-09","year":2020,"date":"June 2020","title":"Ransomware at a space-agency IT contractor","actors":["TA-17"],"attribution":"claimed","kind":"extortion","segments":["supply","ground"],"techniques":["POS-03","MNP-14","EFX-14"],"summary":"A ransomware crew published files it said came from a contractor providing IT services to a space agency.","sources":[{"title":"ZDNet reporting on DoppelPaymer claims, June 2020"}]},{"id":"INC-10","year":2022,"date":"24 February 2022","title":"KA-SAT terminal wipe","actors":["TA-01"],"attribution":"gov","kind":"attack","segments":["ground","user"],"techniques":["POS-02","TRN-01","CTL-11","SRV-08","EFX-04"],"summary":"Intruders used a misconfigured remote-access appliance to reach the management segment of a broadband satellite network and issued destructive commands that overwrote flash memory in tens of thousands of modems across Europe, also cutting remote monitoring of thousands of wind turbines.","sources":[{"title":"Viasat, KA-SAT Network cyber attack overview (30 March 2022)"},{"title":"SentinelLabs, AcidRain: A Modem Wiper Rains Down on Europe"}]},{"id":"INC-11","year":2022,"date":"March 2022","title":"Claimed intrusion at a national space agency","actors":["TA-15"],"attribution":"claimed","kind":"claim","segments":["ground"],"techniques":["POS-02","MNP-02"],"summary":"A hacktivist group published files and claimed to have disrupted a vehicle-monitoring system at Russia's space agency; the agency denied that control systems were affected.","sources":[{"title":"Media reporting of NB65 claims, March 2022"}]},{"id":"INC-12","year":2022,"date":"From March 2022","title":"Jamming of commercial satellite broadband in Ukraine","actors":["TA-09"],"attribution":"gov","kind":"interference","segments":["link","user"],"techniques":["EFX-01","EFX-02"],"summary":"Terminals supplied to Ukraine were jammed near the front line. The operator changed software within days, and US defence officials later cited the speed of that response.","sources":[{"title":"US Department of Defense remarks reported by Breaking Defense, April 2022"}]},{"id":"INC-13","year":2022,"date":"August 2022","title":"Research: fault injection on a broadband user terminal","actors":[],"attribution":"research","kind":"research","segments":["user"],"techniques":["EXP-05","POS-09","SRV-10"],"summary":"A researcher bypassed secure boot on a consumer satellite terminal with a custom board that glitches the power supply, gaining code execution on the device.","sources":[{"title":"L. Wouters, Glitched on Earth by Humans, Black Hat USA 2022"}]},{"id":"INC-14","year":2022,"date":"November 2022","title":"Claimed denial of service against a broadband constellation's sign-in","actors":["TA-13"],"attribution":"claimed","kind":"claim","segments":["ground","user"],"techniques":["EFX-15"],"summary":"A pro-Russian collective claimed to have made a satellite broadband provider's customer sign-in unreachable for several hours.","sources":[{"title":"Trustwave SpiderLabs reporting, November 2022"}]},{"id":"INC-15","year":2022,"date":"Reported December 2022","title":"Intrusion at a US satellite communications provider","actors":["TA-03"],"attribution":"gov","kind":"espionage","segments":["ground"],"techniques":["POS-03","TRN-01","SRV-03"],"summary":"Government incident responders said they found a Russian military intelligence group in the network of a satellite communications provider serving critical-infrastructure customers; it had been present for months.","sources":[{"title":"CyberScoop, CISA researchers: Russia's Fancy Bear infiltrated US satellite network","url":"https://cyberscoop.com/apt28-fancy-bear-satellite/"}]},{"id":"INC-16","year":2022,"date":"May 2022","title":"Espionage campaign against Russian aerospace","actors":["TA-08"],"attribution":"vendor","kind":"espionage","segments":["ground","supply"],"techniques":["POS-01","SRV-03","MNP-14"],"summary":"A vendor described a group using phishing and custom backdoors against aerospace organisations over several years.","sources":[{"title":"Positive Technologies, Space Pirates"}]},{"id":"INC-17","year":2023,"date":"March 2023","title":"Claimed tampering with exposed navigation receivers","actors":["TA-14"],"attribution":"claimed","kind":"claim","segments":["user"],"techniques":["MSN-10","POS-02"],"summary":"A hacktivist group posted screenshots it said showed access to internet-exposed satellite navigation receivers and deletion of their data.","sources":[{"title":"Cyble research blog, March 2023"}]},{"id":"INC-18","year":2023,"date":"April 2023","title":"Research: on-orbit takeover demonstration","actors":[],"attribution":"research","kind":"research","segments":["space"],"techniques":["POS-11","CTL-12","SRV-04","MNP-04"],"summary":"At a security conference, a company team showed it could take control of functions on an experimental agency nanosatellite, alter imagery and hide the changes, working with the agency throughout.","sources":[{"title":"Thales, CYSAT 2023 demonstration on ESA OPS-SAT"}]},{"id":"INC-19","year":2023,"date":"May 2023","title":"Research: security analysis of satellite firmware","actors":[],"attribution":"research","kind":"research","segments":["space","link"],"techniques":["EXP-04","EXP-07","CTL-02","CTL-06"],"summary":"Academics analysed three real satellite firmware images and found missing command protection and exploitable flaws, alongside a survey showing how often designers rely on obscurity.","sources":[{"title":"J. Willbold et al., Space Odyssey: An Experimental Software Security Analysis of Satellites, IEEE S&P 2023"}]},{"id":"INC-20","year":2023,"date":"29 June 2023","title":"Outage at a Russian satellite communications provider","actors":["TA-16"],"attribution":"claimed","kind":"attack","segments":["ground","user"],"techniques":["CTL-11","EFX-04","EFX-05","MNP-14"],"summary":"A provider serving government and energy customers went offline. Unidentified actors claimed to have damaged terminals and leaked files; measurements confirmed the outage.","sources":[{"title":"The Record, Hackers claim to take down Russian satellite communications provider","url":"https://therecord.media/hackers-take-down-russian-satellite-provider"}]},{"id":"INC-21","year":2023,"date":"August 2023","title":"Exercise: first capture-the-flag on a satellite in orbit","actors":[],"attribution":"research","kind":"research","segments":["space","link","ground"],"techniques":["CTL-06","CTL-12","MNP-06"],"summary":"Finalist teams in a government-sponsored contest attacked and defended a purpose-built cubesat in orbit, the first such event on a live spacecraft.","sources":[{"title":"Hack-A-Sat 4 final event on Moonlighter, DEF CON 31"}]},{"id":"INC-22","year":2023,"date":"February to July 2023","title":"Password-spray campaign including the satellite sector","actors":["TA-06"],"attribution":"vendor","kind":"espionage","segments":["ground"],"techniques":["POS-03","MNP-14"],"summary":"A vendor observed thousands of organisations targeted with password spraying, with follow-on intrusion at a small number in the satellite, defence and pharmaceutical sectors.","sources":[{"title":"Microsoft Threat Intelligence, Peach Sandstorm password spray campaigns"}]},{"id":"INC-23","year":2023,"date":"Disclosed November 2023","title":"Breach at Japan's space agency","actors":[],"attribution":"unattributed","kind":"intrusion","segments":["ground"],"techniques":["POS-02","CTL-08","MNP-14"],"summary":"The agency disclosed unauthorised access to its central directory server, reportedly through a network-device flaw, and later reported further attacks in 2024. It said launch and satellite operations data were not affected.","sources":[{"title":"JAXA statements and Japanese government briefings, 2023 to 2024"}]},{"id":"INC-24","year":2024,"date":"2023 to 2025","title":"Persistent navigation interference affecting aviation and shipping","actors":["TA-09"],"attribution":"gov","kind":"interference","segments":["link","user"],"techniques":["EFX-03","MNP-09","EFX-12"],"summary":"Aircraft and ships around the Baltic, Black Sea and Middle East reported daily jamming and spoofing of satellite navigation. Several European governments raised the matter with international bodies.","sources":[{"title":"EASA and IATA statements on GNSS interference, 2024"}]},{"id":"INC-25","year":2024,"date":"March 2024","title":"New variant of the modem wiper appears","actors":["TA-01"],"attribution":"vendor","kind":"attack","segments":["ground","user"],"techniques":["EFX-04","EFX-05"],"summary":"Researchers found a broader successor to the 2022 modem wiper, able to target more embedded device types, around the time of outages at Ukrainian providers.","sources":[{"title":"SentinelLabs, AcidPour: New Embedded Wiper Variant of AcidRain"}]},{"id":"INC-26","year":2024,"date":"2024","title":"Interference with European broadcast satellites","actors":["TA-09"],"attribution":"gov","kind":"interference","segments":["link"],"techniques":["EFX-01","EFX-11"],"summary":"Operators and several European states reported uplink interference that disrupted or replaced television programming; the ITU's Radio Regulations Board called for it to stop.","sources":[{"title":"ITU Radio Regulations Board decisions, 2024"}]},{"id":"INC-27","year":2024,"date":"April to July 2024","title":"Custom backdoor used against satellite and communications-equipment firms","actors":["TA-06"],"attribution":"vendor","kind":"espionage","segments":["ground"],"techniques":["POS-03","POS-01","EXP-10","SRV-03"],"summary":"A vendor reported a new multi-stage backdoor deployed against satellite, communications-equipment, energy and government targets, with attacker infrastructure hosted in fraudulently obtained cloud subscriptions.","sources":[{"title":"Microsoft Threat Intelligence, Peach Sandstorm deploys new custom Tickler malware","url":"https://www.microsoft.com/en-us/security/blog/?p=135563"}]},{"id":"INC-28","year":2025,"date":"March 2025","title":"Claimed cut of satellite communications on Iranian ships","actors":["TA-12"],"attribution":"claimed","kind":"attack","segments":["user","ground"],"techniques":["POS-10","CTL-11","EFX-04"],"summary":"A group claimed to have disabled satellite terminals on 116 tankers and cargo ships by attacking the systems of their communications provider, and claimed a repeat later in the year.","sources":[{"title":"The Maritime Executive, Cyber Hackers Claim to Have Disabled Iranian Ship Communications","url":"https://maritime-executive.com/article/cyber-hackers-claim-to-have-disabled-iranian-ship-communications"}]},{"id":"INC-29","year":2025,"date":"March 2025","title":"Intrusion at Poland's space agency","actors":[],"attribution":"unattributed","kind":"intrusion","segments":["ground"],"techniques":["POS-02","EFX-05"],"summary":"The agency disconnected its network from the internet after detecting unauthorised access to its IT systems, and national cyber services were brought in.","sources":[{"title":"Statements by the Polish Space Agency and the Minister for Digital Affairs, March 2025"}]},{"id":"INC-30","year":2025,"date":"Reported June 2025","title":"Telecom espionage campaign reaches a satellite operator","actors":["TA-05"],"attribution":"vendor","kind":"espionage","segments":["ground"],"techniques":["POS-02","SRV-03","MNP-13"],"summary":"Press reports named a satellite operator among the victims of a state espionage campaign against communications carriers. The company confirmed unauthorised access through a compromised device and reported no customer impact.","sources":[{"title":"Via Satellite, Viasat confirms unauthorized access after Bloomberg report of Salt Typhoon impact","url":"https://www.satellitetoday.com/cybersecurity/2025/06/18/viasat-confirms-unauthorized-access-after-bloomberg-report-of-salt-typhoon-impact"}]},{"id":"INC-31","year":2025,"date":"June 2025","title":"Surge of operations against the space sector during the Israel-Iran war","actors":[],"attribution":"claimed","kind":"claim","segments":["ground","user"],"techniques":["EFX-15","MNP-14","POS-01"],"summary":"A researcher counted more than 67 claimed operations by 25 actors against space organisations during the twelve-day conflict, mostly denial of service and data-leak claims.","sources":[{"title":"Via Satellite, The Space Sector Under Cyber Fire in the US-Israel-Iran War","url":"https://www.satellitetoday.com/opinion/2026/06/17/the-space-sector-under-cyber-fire-in-the-us-israel-iran-war/"}]},{"id":"INC-32","year":2025,"date":"October 2025","title":"Research: sensitive links found unencrypted on geostationary satellites","actors":[],"attribution":"research","kind":"research","segments":["link","user"],"techniques":["MSN-11","MNP-01"],"summary":"University researchers scanning geostationary satellites with consumer equipment found a large share of links unencrypted, including mobile-network backhaul, corporate and government traffic.","sources":[{"title":"UC San Diego and University of Maryland, Don't Look Up, ACM CCS 2025"}]},{"id":"INC-33","year":2025,"date":"December 2025","title":"Data theft from a space agency's external servers","actors":[],"attribution":"claimed","kind":"extortion","segments":["ground","supply"],"techniques":["MSN-13","POS-03","MNP-14"],"summary":"A seller claimed roughly 200 GB including source code and access tokens taken from collaboration servers. The agency said the affected servers were outside its corporate network and held unclassified material; a further, larger theft was claimed afterwards.","sources":[{"title":"Space.com, Cyberthieves hit European Space Agency, stealing hundreds of gigabytes of data","url":"https://www.space.com/space-exploration/esa-email-credentials-on-dark-web"}]},{"id":"INC-34","year":2026,"date":"March to April 2026","title":"Claimed intrusions at Gulf satellite operators","actors":["TA-10"],"attribution":"claimed","kind":"attack","segments":["ground"],"techniques":["POS-04","MNP-13","MNP-14","EFX-05"],"summary":"During the 2026 conflict a persona claimed to have disrupted infrastructure, intercepted communications and deleted data at several Gulf satellite companies and a space agency. One screen recording lent partial support; other claims are unverified. No spacecraft were reported affected.","sources":[{"title":"Via Satellite, The Space Sector Under Cyber Fire in the US-Israel-Iran War","url":"https://www.satellitetoday.com/opinion/2026/06/17/the-space-sector-under-cyber-fire-in-the-us-israel-iran-war/"}]},{"id":"INC-35","year":2026,"date":"March 2026","title":"Intimidation messages to aerospace employees","actors":["TA-11"],"attribution":"claimed","kind":"claim","segments":["supply"],"techniques":["MSN-08","EFX-14"],"summary":"Employees of an aerospace prime based in Israel received text messages claiming their personal data had been breached and urging them to leave.","sources":[{"title":"Via Satellite, The Space Sector Under Cyber Fire in the US-Israel-Iran War","url":"https://www.satellitetoday.com/opinion/2026/06/17/the-space-sector-under-cyber-fire-in-the-us-israel-iran-war/"}]},{"id":"INC-36","year":2026,"date":"First half of 2026","title":"Extortion crews and access brokers concentrate on suppliers","actors":["TA-17","TA-18"],"attribution":"vendor","kind":"extortion","segments":["supply","ground"],"techniques":["MSN-13","EXP-08","POS-03","MNP-14","EFX-14"],"summary":"The sector's sharing centre tracked close to seventy claimed attacks, over half on manufacturers, contractors and integrators, with identity theft, session hijacking and help-desk deception as common ways in. Operators separately reported activity at four times its pre-war level.","sources":[{"title":"Space ISAC, Threat Briefing 46","url":"https://www.kratosspace.com/constellations/articles/analysis-of-data-extortion-actors-and-initial-access-brokers-on-the-commercial-space-industry"},{"title":"Via Satellite, Space Sector Faces 400% Surge in Cyberattacks Amid Iran War","url":"https://www.satellitetoday.com/cybersecurity/2026/06/23/space-sector-faces-400-surge-in-cyberattacks-amid-iran-war-experts-say/"}]}],"attack_paths":[{"id":"AP-01","name":"Terminal fleet wipe through the management plane","summary":"An intruder enters through an internet-facing appliance, reaches the network that manages user terminals and disables them in bulk. Modelled on the 2022 KA-SAT attack.","steps":[{"technique":"MSN-10","note":"Finds a remote-access appliance belonging to the ground network."},{"technique":"EXP-06","note":"Identifies a flaw or misconfiguration in that appliance."},{"technique":"POS-02","note":"Gains a foothold on the appliance."},{"technique":"TRN-01","note":"Moves into the trusted management segment."},{"technique":"CTL-11","note":"Obtains the ability to issue management commands to terminals."},{"technique":"SRV-08","note":"Uses legitimate management functions, which look routine."},{"technique":"EFX-04","note":"Sends destructive commands to a large share of the fleet."}],"breakpoints":["SC-16","SC-14","SC- /* ───────── indexes ───────── */
const X = DATA.taxonomy;
const by = a => Object.fromEntries(a.map(o => [o.id, o]));
const PH = by(DATA.phases), TQ = by(DATA.techniques), SC = by(DATA.controls), ME = by(DATA.mission_effects),
      DS = by(DATA.data_sources), TA = by(DATA.actors), INC = by(DATA.incidents), AP = by(DATA.attack_paths);
const TX = {}; for (const k in X) TX[k] = by(X[k]);
const rev = () => ({});
const actorsOf = rev(), incsOf = rev(), pathsOf = rev(), techsOfCtl = rev(), incsOfActor = rev();
const push = (m, k, v) => (m[k] = m[k] || []).push(v);
DATA.actors.forEach(a => a.techniques.forEach(m => push(actorsOf, m.id, {a, basis: m.basis})));

DATA.attack_paths.forEach(p => [...new Set(p.steps.map(s => s.technique))].forEach(t => push(pathsOf, t, p)));
DATA.techniques.forEach(t => t.controls.forEach(c => push(techsOfCtl, c, t)));
const MAXACT = Math.max(...DATA.techniques.map(t => (actorsOf[t.id] || []).length));

const VIEWS = [["matrix", "Matrix"], ["surface", "Threat surface"], ["paths", "Attack paths"], ["actors", "Threat actors"],

const FACETS = [

/* ───────── state ───────── */
const S = {view: "matrix", q: "", f: {}, pin: null, color: "phase", dim: false, sel: null, open: {seg: true}, shut: {},
  aType: "", iKind: "", assess: {name: "", t: {}, c: {}}};
FACETS.forEach(f => S.f[f.k] = new Set());
const KEY = "spectra.assessment.v1";
const store = {
  load() { try { const v = JSON.parse(localStorage.getItem(KEY)); if (v && v.t && v.c) S.assess = v; } catch (e) {} },
  save() { try { localStorage.setItem(KEY, JSON.stringify(S.assess)); } catch (e) {} },

/* ───────── helpers ───────── */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const nm = (map, id) => esc((map[id] || {}).name || id);
const plural = (n, w) => n + " " + w + (n === 1 ? "" : "s");
const hay = o => JSON.stringify(o).toLowerCase();
const HAY = new Map();
const hit = o => { if (!S.q) return true; let h = HAY.get(o); if (!h) HAY.set(o, h = hay(o)); return S.q.toLowerCase().split(/\s+/).every(w => h.includes(w)); };

function matches(t, skip) {
  if (S.pin && !S.pin.ids.has(t.id)) return false;
  for (const f of FACETS) {
    if (f.k === skip) continue;
    const set = S.f[f.k];
    if (set.size && !f.get(t).some(v => set.has(String(v)))) return false;
  }
  return hit(t);
}
const visible = () => DATA.techniques.filter(t => matches(t));
const anyFilter = () => !!S.pin || !!S.q || FACETS.some(f => S.f[f.k].size);
function coverage(t) {
  let s = 0; t.controls.forEach(c => { const v = S.assess.c[c]; s += v === "full" ? 1 : v === "partial" ? .5 : 0; });
  return s / t.controls.length;
}
function heat(t) {
  const st = (S.assess.t[t.id] || {}).status || "";
  switch (S.color) {
    case "tier": return ["var(--EFX)", t.tier * 14];
    case "basis": return [{O: "var(--bad)", D: "var(--warn)", T: "var(--EXP)"}[t.basis], 26];
    case "actors": { const n = (actorsOf[t.id] || []).length; return ["var(--MSN)", n ? 12 + 48 * n / MAXACT : 0]; }
    case "coverage": { const c = coverage(t); return c >= 1 ? ["var(--good)", 30] : ["var(--bad)", 5 + 27 * (1 - c)]; }
    case "status": return [{exposed: "var(--bad)", partial: "var(--warn)", verified: "var(--good)", na: "var(--na)"}[st] || "transparent", st ? 34 : 0];
  }
  return ["transparent", 0];
}

/* ───────── hash ───────── */
function writeHash() {
  const p = ["view=" + S.view];
  FACETS.forEach(f => { if (S.f[f.k].size) p.push(f.k + "=" + [...S.f[f.k]].join(",")); });
  if (S.q) p.push("q=" + encodeURIComponent(S.q));
  if (S.sel) p.push("sel=" + S.sel);
  const h = "#" + p.join("&");
  if (location.hash !== h) history.replaceState(null, "", h);
}
function readHash() {
  const h = location.hash.replace(/^#/, ""); if (!h) return;
  FACETS.forEach(f => S.f[f.k].clear()); S.sel = null; S.q = "";
  h.split("&").forEach(kv => {
    const i = kv.indexOf("="); if (i < 0) return;
    const k = kv.slice(0, i), v = decodeURIComponent(kv.slice(i + 1));
    if (k === "view" && VIEWS.some(x => x[0] === v)) S.view = v;
    else if (k === "q") S.q = v;
    else if (k === "sel" && lookup(v)) S.sel = v;
    else if (FK[k]) v.split(",").forEach(x => { if (FK[k].items.some(it => String(it.id) === x)) S.f[k].add(x); });
  });
  $("q").value = S.q;
}
const lookup = id => TQ[id] || SC[id] || TA[id] || INC[id];

/* ───────── chrome ───────── */
function renderTabs() {
  $("tabs").innerHTML = VIEWS.map(([k, l]) => `<button class="tab" role="tab" aria-selected="${S.view === k}" data-act="view" data-v="${k}">${l}</button>`).join("");
}
function renderFilters() {
  const n = FACETS.reduce((a, f) => a + S.f[f.k].size, 0);
  let h = `<h2>Filter techniques <span>${n || S.pin ? `<button class="linkbtn" data-act="clear">Clear all</button> ` : ""}<button class="iconbtn only-m" data-act="filters">Done</button></span></h2>`;
  for (const f of FACETS) {
    const base = DATA.techniques.filter(t => matches(t, f.k));
    const cnt = {}; base.forEach(t => f.get(t).forEach(v => cnt[v] = (cnt[v] || 0) + 1));
    const opt = it => { const c = cnt[it.id] || 0, on = S.f[f.k].has(String(it.id));
      return `<label class="opt${c || on ? "" : " zero"}" title="${esc(it.desc || it.description || "")}"><input type="checkbox" data-facet="${f.k}" value="${esc(it.id)}"${on ? " checked" : ""}><span>${esc(it.name)}</span><i>${c}</i></label>`; };
    let body = "";
    if (f.groupBy) for (const g of Object.values(f.groups)) { const its = f.items.filter(it => it[f.groupBy] === g.id); if (its.length) body += `<div class="grp">${esc(g.name)}</div>` + its.map(opt).join(""); }
    else body = f.items.map(opt).join("");
    h += `<details class="facet" data-fk="${f.k}"${S.open[f.k] ? " open" : ""}><summary>${f.label}${S.f[f.k].size ? `<em>${S.f[f.k].size}</em>` : ""}</summary>${body}</details>`;
  }
  $("filters").innerHTML = h;
}
function chipsHtml() {
  let h = "";
  if (S.pin) h += `<span class="chip">${esc(S.pin.label)}<button data-act="unpin" aria-label="Remove">×</button></span>`;
  FACETS.forEach(f => S.f[f.k].forEach(v => { const it = f.items.find(i => String(i.id) === v);
    h += `<span class="chip">${f.label}: ${esc(it ? it.name : v)}<button data-act="unfilter" data-k="${f.k}" data-v="${esc(v)}" aria-label="Remove">×</button></span>`; }));
  if (S.q) h += `<span class="chip">Search: ${esc(S.q)}<button data-act="unq" aria-label="Remove">×</button></span>`;

/* ───────── views ───────── */
function cellHtml(t, shown) {

  return `<button class="cell${shown ? "" : " dim"}${S.sel === t.id ? " sel" : ""}" data-act="open" data-id="${t.id}" style="--heat:${c};--amt:${a.toFixed(0)}%">

function legendHtml() {

function vMatrix() {
  const vis = new Set(visible().map(t => t.id));
  let h = `<div class="toolbar"><span class="count">${vis.size} <small>of ${DATA.techniques.length} techniques</small></span><span class="grow"></span>
    <label>Colour by <select id="color">${[["phase", "Phase"], ["tier", "Adversary capability"], ["basis", "Evidence"], ["actors", "Actor activity"], ["coverage", "Control coverage"], ["status", "Assessment status"]].map(o => `<option value="${o[0]}"${S.color === o[0] ? " selected" : ""}>${o[1]}</option>`).join("")}</select></label>

  if (!vis.size) return h + `<div class="empty">No technique matches these filters. <button class="linkbtn" data-act="clear">Clear all filters</button></div>`;

      <div class="cells">${list.map(t => cellHtml(t, vis.has(t.id))).join("")}</div></section>`;

function vSurface() {
  const cnt = {}, segc = {}, vecc = {};

}
function csv() {
  const q = v => '"' + String(v).replace(/"/g, '""') + '"';
  const rows = [["id", "phase", "name", "segments", "assets", "ways_in", "tier", "evidence", "mission_effects", "controls", "control_coverage", "status", "notes"]];
  visible().forEach(t => { const a = S.assess.t[t.id] || {}; rows.push([t.id, PH[t.phase].name, t.name, t.segments.join(" "), t.assets.join(" "), t.vectors.join(" "), t.tier, TX.basis[t.basis].name,
    t.effects.map(e => ME[e].name).join("; "), t.controls.join(" "), Math.round(coverage(t) * 100) + "%", (STATUS.find(s => s[0] === (a.status || "")) || [0, ""])[1], a.note || ""]); });
  download("spectra-techniques.csv", rows.map(r => r.map(q).join(",")).join("\r\n"), "text/csv");
  toast("Exported " + (rows.length - 1) + " techniques");
}
function exportLayer() {
  const out = {format: "spectra-assessment", spectra_version: DATA.meta.version, name: S.assess.name, exported: new Date().toISOString(), techniques: S.assess.t, controls: S.assess.c};
  download((S.assess.name || "spectra-assessment").replace(/[^\w.-]+/g, "-").toLowerCase() + ".json", JSON.stringify(out, null, 2), "application/json");
  toast("Assessment exported");
}
function importLayer(text) {
  let o; try { o = JSON.parse(text); } catch (e) { return toast("That file is not valid JSON"); }
  if (!o || o.format !== "spectra-assessment") return toast("That file is not a SPECTRA assessment");
  const t = {}, c = {}; let skipped = 0;
  for (const [k, v] of Object.entries(o.techniques || {})) { if (TQ[k] && v && typeof v === "object") { const st = STATUS.some(s => s[0] === v.status) ? v.status : ""; t[k] = {status: st, note: String(v.note || "").slice(0, 4000)}; } else skipped++; }
  for (const [k, v] of Object.entries(o.controls || {})) { if (SC[k] && CSTAT.some(s => s[0] === v)) c[k] = v; else skipped++; }
  S.assess = {name: String(o.name || "").slice(0, 120), t, c}; store.save(); render(true);
  toast("Assessment imported" + (skipped ? ", " + skipped + " unknown entries skipped" : ""));
}
function setTheme(v) { document.documentElement.dataset.theme = v; $("themebtn").textContent = v === "dark" ? "Light" : "Dark"; }

/* ───────── events ───────── */
const ACT = {
  view(e) { S.view = e.dataset.v; S.sel = null; $("filters").classList.remove("on"); render(); },
  home(e, ev) { ev.preventDefault(); S.view = "matrix"; S.sel = null; render(); },
  open(e) { S.sel = e.dataset.id; renderDrawer(); writeHash(); document.querySelectorAll(".cell.sel").forEach(c => c.classList.remove("sel")); const c = document.querySelector(`.cell[data-id="${S.sel}"]`); if (c) c.classList.add("sel"); },
  close() { if ($("filters").classList.contains("on") && !S.sel) { $("filters").classList.remove("on"); $("scrim").classList.remove("on"); return; } S.sel = null; renderDrawer(); writeHash(); document.querySelectorAll(".cell.sel").forEach(c => c.classList.remove("sel")); },
  filters() { const f = $("filters"); f.classList.toggle("on"); $("scrim").classList.toggle("on", f.classList.contains("on")); },
  theme() { const v = document.documentElement.dataset.theme === "dark" ? "light" : "dark"; setTheme(v); store.theme(v); },
  clear() { FACETS.forEach(f => S.f[f.k].clear()); S.pin = null; S.q = ""; $("q").value = ""; render(true); },
  unfilter(e) { S.f[e.dataset.k].delete(e.dataset.v); render(true); },
  unpin() { S.pin = null; render(true); },
  unq() { S.q = ""; $("q").value = ""; render(true); },
  col(e) { S.shut[e.dataset.id] = !S.shut[e.dataset.id]; e.parentElement.classList.toggle("shut"); },
  go(e) { FACETS.forEach(f => S.f[f.k].clear()); S.pin = null; S.f[e.dataset.k].add(e.dataset.v); S.open[e.dataset.k] = true; S.view = "matrix"; S.sel = null; render(); },
  pin(e) { const o = e.dataset.kind === "path" ? AP[e.dataset.id] : INC[e.dataset.id];
    S.pin = {label: (e.dataset.kind === "path" ? "Path: " + o.name : "Incident: " + o.title), ids: new Set(o.steps ? o.steps.map(s => s.technique) : o.techniques)};
    S.view = "matrix"; S.sel = null; S.dim = true; render(); },
  path(e) { S.view = "paths"; S.sel = null; S.open[e.dataset.id] = true; S.q = ""; $("q").value = ""; render(); const el = document.querySelector(`[data-pk="${e.dataset.id}"]`); if (el) el.scrollIntoView({block: "start"}); },
  atype(e) { S.aType = e.dataset.v; render(true); },
  cstat(e) { if (e.dataset.v) S.assess.c[e.dataset.id] = e.dataset.v; else delete S.assess.c[e.dataset.id]; store.save(); render(true); },
  tstat(e) { const a = S.assess.t[e.dataset.id] = S.assess.t[e.dataset.id] || {}; a.status = e.dataset.v; if (!a.status && !a.note) delete S.assess.t[e.dataset.id]; store.save(); render(true); },
  covmatrix() { S.color = "coverage"; S.view = "matrix"; render(); },
  csv, export: exportLayer,
  import() { $("file").click(); },
  print() { window.print(); },
  reset() { if (confirm("Clear every status and note in this assessment? Export first if you want to keep it.")) { S.assess = {name: "", t: {}, c: {}}; store.save(); render(true); toast("Assessment cleared"); } },
};
document.addEventListener("click", ev => { const e = ev.target.closest("[data-act]"); if (e && ACT[e.dataset.act]) ACT[e.dataset.act](e, ev); });
document.addEventListener("change", ev => {
  const e = ev.target;
  if (e.dataset.facet) { const s = S.f[e.dataset.facet]; e.checked ? s.add(e.value) : s.delete(e.value); render(true); }
  else if (e.id === "color") { S.color = e.value; render(true); }
  else if (e.id === "dim") { S.dim = e.checked; render(true); }
  else if (e.id === "ikind") { S.iKind = e.value; render(true); }
  else if (e.id === "aname") { S.assess.name = e.value; store.save(); }
  else if (e.dataset.status) { const a = S.assess.t[e.dataset.status] = S.assess.t[e.dataset.status] || {}; a.status = e.value; if (!a.status && !a.note) delete S.assess.t[e.dataset.status]; store.save(); render(true); }
  else if (e.id === "file" && e.files[0]) { const r = new FileReader(); r.onload = () => importLayer(String(r.result)); r.readAsText(e.files[0]); e.value = ""; }
});
document.addEventListener("input", ev => {
  const e = ev.target;
  if (e.dataset.note) { const a = S.assess.t[e.dataset.note] = S.assess.t[e.dataset.note] || {}; a.note = e.value; if (!a.status && !a.note) delete S.assess.t[e.dataset.note]; store.save(); }
  else if (e.id === "q") { S.q = e.value.trim(); clearTimeout(render.h); render.h = setTimeout(() => render(true), 120); }
});
document.addEventListener("toggle", ev => { const e = ev.target; if (e.dataset && e.dataset.fk) S.open[e.dataset.fk] = e.open; else if (e.dataset && e.dataset.pk) S.open[e.dataset.pk] = e.open; }, true);
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape") ACT.close();
  else if (ev.key === "/" && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { ev.preventDefault(); $("q").focus(); }
});
window.addEventListener("hashchange", () => { readHash(); render(true); });

/* ───────── start ───────── */
$("ver").textContent = "Space cyber framework " + DATA.meta.version;
$("rainbow").innerHTML = DATA.phases.map(p => `<i data-ph="${p.id}"></i>`).join("");
setTheme(store.theme() || (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
store.load(); readHash();
if (window.innerWidth <= 900) DATA.phases.forEach((p, i) => { if (i) S.shut[p.id] = true; });
render();
</script>
</body>
</html>
